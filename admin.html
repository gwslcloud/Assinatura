<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin - Assinatura Parfum</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-lg shadow-xl">
        <h1 class="text-2xl font-bold mb-6 border-b border-yellow-600 pb-2">Gerenciar Produto</h1>
        
        <form id="adminForm" class="space-y-4 text-black">
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="prodId" placeholder="ID (ex: 101)" class="p-2 rounded" required>
                <input type="text" id="prodMarca" placeholder="Marca" class="p-2 rounded" required>
                <input type="text" id="prodNome" placeholder="Nome do Perfume" class="p-2 rounded" required>
                <input type="text" id="prodOrigem" placeholder="Origem (Nacional/Importado)" class="p-2 rounded">
                <input type="number" step="0.01" id="prodPreco" placeholder="Preço" class="p-2 rounded" required>
                <input type="number" step="0.01" id="prodPromo" placeholder="Preço Promoção (0 se não tiver)" class="p-2 rounded">
            </div>
            
            <textarea id="prodDesc" placeholder="Descrição" class="w-full p-2 rounded h-24"></textarea>
            <input type="text" id="prodImg" placeholder="URL da Imagem" class="w-full p-2 rounded">
            
            <div class="flex items-center gap-2 text-white">
                <input type="checkbox" id="prodBestSeller"> 
                <label>Mais Vendido?</label>
            </div>

            <button type="submit" class="w-full bg-yellow-600 text-white font-bold py-3 rounded hover:bg-yellow-700 transition">
                SALVAR NA PLANILHA
            </button>
        </form>
        <p id="status" class="mt-4 text-center font-bold"></p>
    </div>

    <script>
        const SCRIPT_URL = "COLE_A_URL_DO_SEU_APPS_SCRIPT_AQUI";

        document.getElementById('adminForm').onsubmit = async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.innerText = "Enviando...";

            const payload = {
                action: 'edit', // O script tenta editar, se não achar o ID, você pode ajustar para 'add'
                id: document.getElementById('prodId').value,
                marca: document.getElementById('prodMarca').value,
                nome: document.getElementById('prodNome').value,
                origem: document.getElementById('prodOrigem').value,
                preco: parseFloat(document.getElementById('prodPreco').value),
                promocao: parseFloat(document.getElementById('prodPromo').value || 0),
                descricao: document.getElementById('prodDesc').value,
                imagem: document.getElementById('prodImg').value,
                maisVendido: document.getElementById('prodBestSeller').checked ? "1" : "0",
                // Adicione os outros campos (notas, dna) conforme necessário
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                status.innerText = result.message;
                if(result.result === 'success') {
                    status.className = "mt-4 text-center font-bold text-green-500";
                }
            } catch (error) {
                status.innerText = "Erro ao salvar!";
                status.className = "mt-4 text-center font-bold text-red-500";
            }
        };
    </script>
</body>
</html>
