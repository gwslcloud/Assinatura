<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Parfum</title>
    
    <!-- ÍCONE DA ABA DO NAVEGADOR -->
    <link rel="icon" type="image/png" href="assinatura.png">
    
    <!-- FRAMEWORKS E FONTES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           BIZU: CORES PRINCIPAIS DO SITE (ALTERE OS HEXADECIMAIS AQUI)
           ============================================================ */
        :root {
            --verde-fundo: #00160f; 
            --verde-detalhe: #002419;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
            --vermelho-esgotado: #ff0000;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde-fundo); 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }

        /* TEXTURA DE RUÍDO (GRAIN) */
        .noise-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9998;
            opacity: 0.04;
            background-image: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
        }

        /* ELEMENTO CANVAS PARA A POEIRA DE OURO */
        #magicDustCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99999;
        }

        /* BARRA DE PROGRESSO DOURADA */
        #scrollProgress {
            position: fixed;
            top: 0; left: 0;
            width: 0%; height: 2px;
            background: linear-gradient(90deg, var(--dourado-logo), var(--dourado-brilho));
            z-index: 10000;
            box-shadow: 0 0 8px rgba(197, 160, 89, 0.5);
            transition: width 0.1s ease-out;
        }

        .font-luxury { font-family: 'Cinzel', serif; }

        /* BADGE "SELO DE LACRE" */
        .badge-best-seller {
            position: absolute;
            top: 10px;
            left: 10px;
            background: radial-gradient(circle at 30% 30%, #f1dca7, #c5a059 60%, #8b6d31);
            color: white;
            font-size: 7px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 20;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(0,0,0,0.15);
            box-shadow: 
                1px 2px 4px rgba(0,0,0,0.5), 
                inset 1px 1px 1px rgba(255,255,255,0.4),
                inset -1px -1px 1px rgba(0,0,0,0.2);
            text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
        }

        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, transform 0.8s ease;
            overflow: hidden;
        }

        .video-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle, transparent 20%, #000 95%),
                linear-gradient(to bottom, transparent 80%, #000 100%),
                linear-gradient(to top, transparent 80%, #000 100%);
            pointer-events: none;
            z-index: 10000;
        }

        #introVideo {
            width: 100%; height: 100%; object-fit: contain;
            filter: contrast(1.1) brightness(0.9);
            mix-blend-mode: lighten; 
        }

        /* BIZU: CABEÇALHO E LOGO */
        .header-container {
            position: relative;
            padding: 0.8rem 1rem 0.2rem 1rem; 
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            overflow: hidden; 
            background: linear-gradient(to bottom, #001f15 0%, var(--verde-fundo) 100%);
            min-height: 85px; 
        }

        .logo-main { 
            width: 110px; 
            position: relative; 
            z-index: 5; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
            transition: transform 0.4s ease;
            cursor: pointer;
        }

        .luxury-line-container {
            flex-grow: 1;
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .luxury-line-text {
            font-family: 'Cinzel', serif;
            font-size: 7px;
            letter-spacing: 4px;
            color: var(--dourado-logo);
            text-transform: uppercase;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .luxury-pulse-line {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, var(--dourado-logo) 0%, rgba(197, 160, 89, 0.1) 100%);
            position: relative;
            overflow: hidden;
        }

        /* BIZU: BARRA DE PESQUISA */
        .search-area { 
            padding: 0rem 1.5rem 0.8rem; 
            margin-top: -12px; 
            position: relative; 
            z-index: 11; 
            max-width: 100%; 
        }

        .search-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 8px 20px; 
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%; 
            background: transparent; 
            border: none;
            outline: none; 
            text-transform: uppercase; 
            font-size: 11px;
            color: #fff; 
            letter-spacing: 2px; 
            text-align: center; 
            font-weight: 300;
        }

        /* BIZU: MENU DE MARCAS (AGORA MANUAL E ALINHADO) */
        .brand-section-container {
            display: flex;
            align-items: flex-start;
            gap: 8px; 
            padding: 0 15px;
            margin-bottom: 1rem;
        }

        .menu-hamburger {
            width: 45px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 1px solid rgba(197, 160, 89, 0.2);
            background: rgba(255,255,255,0.02); border-radius: 4px;
            flex-shrink: 0;
        }

        #brandMenu {
            display: flex; 
            overflow-x: auto; 
            gap: 8px; 
            padding: 0 0 12px 0; 
            align-items: flex-start;
            max-width: 100%;
            scrollbar-width: thin;
            scrollbar-color: var(--dourado-logo) transparent;
        }

        .brand-item {
            font-family: 'Cinzel', serif; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0 12px; 
            font-size: 10px; 
            text-transform: uppercase;
            color: rgba(197, 160, 89, 0.7); 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(8px);
            white-space: nowrap;
            letter-spacing: 1px;
            transition: all 0.4s;
            cursor: pointer;
            border-radius: 4px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-item.active { 
            background: rgba(197, 160, 89, 0.1); 
            color: #fff; 
            border-color: var(--dourado-logo);
        }

        /* BIZU: GRID DE PRODUTOS */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; padding: 0 15px; 
            max-width: 100%;
        }

        @media (min-width: 1024px) {
            .product-grid { grid-template-columns: repeat(4, 1fr); max-width: 1400px; margin: 0 auto; gap: 30px; }
        }

        .product-card {
            position: relative;
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 15px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 10px 30px rgba(0,10,5,0.8);
            overflow: hidden;
        }

        .product-img { height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; cursor: pointer; overflow: hidden; }
        .product-img img { max-height: 100%; object-fit: contain; transition: transform 0.6s cubic-bezier(0.33, 1, 0.68, 1); }
        .product-card:hover .product-img img { transform: scale(1.12); }

        .product-brand { font-size: 9px; color: var(--dourado-logo); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 2px; }
        .product-name { font-size: 13px; font-weight: 400; text-transform: uppercase; line-height: 1.3; height: 2.6em; overflow: hidden; margin-bottom: 10px; color: #fff; letter-spacing: 1px; }
        
        .product-price { 
            font-size: 16px; 
            font-weight: 700; 
            margin-bottom: 18px; 
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldFoil 3s linear infinite;
            display: block;
        }

        /* BIZU: STATUS INDISPONÍVEL CORRIGIDO */
        .status-unavailable {
            color: var(--vermelho-esgotado) !important;
            -webkit-text-fill-color: var(--vermelho-esgotado) !important;
            background: none !important;
            font-size: 10px !important;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: none !important;
        }

        @keyframes goldFoil { to { background-position: 200% center; } }

        .btn-add {
            background: #ffffff; color: #000; width: 100%; padding: 14px 0; border: 1px solid rgba(197, 160, 89, 0.4); 
            font-family: 'Cinzel', serif; font-weight: 700; font-size: 9px; text-transform: uppercase; letter-spacing: 2.5px; cursor: pointer; 
        }

        /* BIZU: MODAIS (CARRINHO E PRODUTO) */
        #productModal, #cartModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; }
        #productModal { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); justify-content: center; align-items: center; padding: 20px; }
        
        .modal-container {
            background: rgba(0, 22, 15, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); 
            width: 100%; max-width: 450px; padding: 40px 25px; position: relative; max-height: 90vh; overflow-y: auto; border-radius: 8px;
        }

        #cartModal { justify-content: flex-end; pointer-events: none; transition: background 0.4s ease; }
        #cartModal.open { display: flex; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); pointer-events: auto; }
        #cartModal .modal-container {
            background: #fff; color: #000; width: 100%; max-width: 400px; height: 100%; max-height: 100vh;
            margin-right: -420px; transition: margin-right 0.4s cubic-bezier(0.23, 1, 0.32, 1); border-radius: 0;
        }
        #cartModal.open .modal-container { margin-right: 0; }

        .close-modal { position: absolute; top: 5px; right: 15px; color: #ff0000; font-size: 45px; cursor: pointer; font-weight: bold; }

        /* BIZU: BOTÃO FLUTUANTE */
        .cart-float { position: fixed; bottom: 30px; right: 20px; background: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 100; box-shadow: 0 6px 25px rgba(0,0,0,0.7); cursor: pointer; }
        .cart-count { position: absolute; top: 0px; right: 0px; background: #ff0000; color: #fff; font-size: 11px; width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #fff; }

        /* BIZU: RODAPÉ PREMIUM */
        .premium-footer { background-color: #000c08; border-top: 1px solid rgba(197, 160, 89, 0.2); padding: 60px 20px 40px; margin-top: 80px; text-align: center; }
        .footer-logo-small { width: 130px; margin: 0 auto 20px; cursor: pointer; }
        .footer-column ul li a { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; }
        .footer-column ul li a:hover { color: var(--dourado-logo); }
        .no-click { cursor: default !important; color: #555 !important; }

    </style>
</head>
<body>

    <canvas id="magicDustCanvas"></canvas>
    <div class="noise-bg"></div>
    <div id="scrollProgress"></div>
    <div id="luxuryToast"></div>

    <div id="sidebarOverlay" class="sidebar-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2999;" onclick="toggleSidebar(false)"></div>
    <nav id="sidebar" style="position:fixed; top:0; left:-300px; width:280px; height:100%; background:var(--verde-fundo); z-index:3000; transition:0.4s; border-right:1px solid rgba(255,255,255,0.1);">
        <div class="p-6 border-b border-gray-800 flex justify-between items-center">
            <span class="font-luxury text-white tracking-widest text-sm">MENU</span>
            <span class="text-white text-2xl cursor-pointer" onclick="toggleSidebar(false)">&times;</span>
        </div>
        <div id="sidebarOriginsList"></div>
    </nav>

    <div id="splash-screen">
        <div class="video-vignette"></div>
        <video id="introVideo" autoplay muted playsinline><source src="VideoEntrada.mp4" type="video/mp4"></video>
    </div>

    <!-- BIZU: CABEÇALHO -->
    <header class="header-container">
        <img src="assinatura.png" alt="Logo" class="logo-main" onclick="resetPage()">
        <div class="luxury-line-container">
            <span class="luxury-line-text">Perfumaria De Luxo</span>
            <div class="luxury-pulse-line"></div>
        </div>
    </header>

    <div class="search-area">
        <div class="search-container">
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="BUSQUE SUA FRAGRÂNCIA..." class="search-input">
        </div>
    </div>

    <div class="brand-section-container">
        <div class="menu-hamburger" onclick="toggleSidebar(true)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c5a059" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </div>
        <div id="brandMenu"></div>
    </div>

    <main class="product-grid" id="productGrid"></main>

    <!-- BIZU: MODAIS -->
    <div id="productModal" onclick="closeModalExterno(event, 'productModal')">
        <div class="modal-container" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModal('productModal')">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <div id="cartModal" onclick="closeModalExterno(event, 'cartModal')">
        <div class="modal-container" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModal('cartModal')">&times;</span>
            <h2 class="font-luxury text-xl text-center py-6">RESUMO DO PEDIDO</h2>
            <div id="cartSummaryList" class="px-6 overflow-y-auto" style="max-height: 50vh;"></div>
            <div class="p-6 border-t">
                <div class="flex justify-between font-bold mb-4"><span>TOTAL:</span><span id="cartSummaryTotal">R$ 0,00</span></div>
                <button class="btn-add bg-black text-white" onclick="finalizeOrder()">FINALIZAR NO WHATSAPP</button>
            </div>
        </div>
    </div>

    <!-- BIZU: RODAPÉ -->
    <footer class="premium-footer">
        <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-10">
            <div class="footer-column">
                <img src="assinatura.png" class="footer-logo-small" alt="Logo" onclick="resetPage()">
                <p class="text-[9px] text-gray-500 uppercase tracking-widest">A arte da perfumaria fina.</p>
            </div>
            <div class="footer-column">
                <h3 class="footer-title">Coleções</h3>
                <ul class="space-y-3">
                    <li><a onclick="resetPage()">Ver Tudo</a></li>
                    <li><a onclick="filterByBestSellers()">Mais Vendidos</a></li>
                </ul>
            </div>
            <div class="footer-column">
                <h3 class="footer-title">Atendimento</h3>
                <ul class="space-y-3">
                    <li><a href="https://wa.me/5595991154395" target="_blank">Suporte WhatsApp</a></li>
                    <li><span class="no-click text-[10px] uppercase tracking-widest text-gray-600">Boa Vista - Roraima</span></li>
                </ul>
            </div>
        </div>
    </footer>

    <div class="cart-float" onclick="openCartModal()">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="black"><path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5z"/></svg>
        <div class="cart-count" id="cartBadge">0</div>
    </div>

    <script>
        /* BIZU: CONFIGURAÇÕES DA PLANILHA E WHATSAPP */
        const BASE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0crXc21GaE7jllSoyZqiE5xIa7lGGvtKEFjbK-0oil1dQWdMwcz6cRpH70qPbWMwzZF1KlLEP8d83/pub?gid=0&single=true&output=csv'; 
        let database = [];
        let cart = [];
        const whatsappNumber = "5595991154395";

        /* BIZU: SISTEMA DE PARTÍCULAS (POEIRA DE OURO) */
        const canvas = document.getElementById('magicDustCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 1.5 - 0.75;
                this.speedY = Math.random() * 1.5 - 0.75;
                this.life = 1; this.decay = Math.random() * 0.015 + 0.01;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.life -= this.decay; }
            draw() { ctx.globalAlpha = this.life; ctx.fillStyle = '#c5a059'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function handleParticles(e) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            for (let i = 0; i < 3; i++) particles.push(new Particle(x, y));
        }
        window.addEventListener('mousemove', handleParticles);
        window.addEventListener('touchmove', handleParticles);
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* BIZU: LOGICA DE RESET E FILTROS */
        function resetPage() {
            document.getElementById('searchInput').value = "";
            filterByBrand('Todos');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterByBestSellers() {
            const filtered = database.filter(p => p.maisVendido);
            displayProducts(filtered, true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* BIZU: CARREGAMENTO DE DADOS */
        async function loadSheetData() {
            try {
                const response = await fetch(BASE_SHEET_URL + '&t=' + new Date().getTime());
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1); 
                database = rows.map(row => {
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    return {
                        id: columns[0]?.replace(/"/g, '').trim(),
                        marca: columns[1]?.replace(/"/g, '').trim(),
                        origem: columns[2]?.replace(/"/g, '').trim(), 
                        nome: columns[3]?.replace(/"/g, '').trim(),   
                        preco: parseFloat(columns[4]?.replace(/"/g, '').replace(',', '.').trim() || 0),
                        promocao: parseFloat(columns[5]?.replace(/"/g, '').replace(',', '.').trim() || 0),
                        imagem: columns[6]?.replace(/"/g, '').trim(),
                        descricao: columns[7]?.replace(/"/g, '').trim() || "Fragrância exclusiva.",
                        maisVendido: columns[8]?.trim() === "1",
                        notasTopo: columns[9]?.replace(/"/g, '').trim() || "",
                        notasCoracao: columns[10]?.replace(/"/g, '').trim() || "",
                        notasBase: columns[11]?.replace(/"/g, '').trim() || ""
                    };
                }).filter(p => p.nome && p.nome.length > 2);
                generateMenus(database);
                displayProducts(database, true);
            } catch (e) { console.error("Erro planilha:", e); }
        }

        function generateMenus(data) {
            const horizontalMenu = document.getElementById('brandMenu');
            const brands = [...new Set(data.map(p => p.marca))].sort();
            let html = `<div class="brand-item active" onclick="filterByBrand('Todos', this)">TODOS</div>`;
            brands.forEach(b => html += `<div class="brand-item" onclick="filterByBrand('${b}', this)">${b.toUpperCase()}</div>`);
            horizontalMenu.innerHTML = html;
        }

        function filterByBrand(brand, element) {
            if (element) {
                document.querySelectorAll('.brand-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
            }
            const filtered = brand === 'Todos' ? database : database.filter(p => p.marca === brand);
            displayProducts(filtered, true);
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = database.filter(p => p.nome.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term));
            displayProducts(filtered, false);
        }

        /* BIZU: VITRINE DE PRODUTOS */
        function getPriceDisplay(p) {
            if (p.preco <= 0) return '<span class="status-unavailable">INDISPONÍVEL</span>';
            if (p.promocao > 0) return `<span style="text-decoration:line-through; opacity:0.4; font-size:12px;">R$ ${p.preco.toFixed(2)}</span><br>R$ ${p.promocao.toFixed(2)}`;
            return `R$ ${p.preco.toFixed(2)}`;
        }

        function displayProducts(products, animate) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => {
                const inCart = cart.find(c => c.id === p.id);
                const qty = inCart ? inCart.qty : 0;
                return `
                <div class="product-card">
                    ${p.maisVendido ? '<div class="badge-best-seller">★ Mais vendido</div>' : ''}
                    <div onclick="openModal('${p.id}')">
                        <div class="product-img"><img src="${p.imagem}" onerror="this.src='assinatura.png'"></div>
                        <p class="product-brand">${p.marca}</p>
                        <h2 class="product-name font-luxury">${p.nome}</h2>
                        <span class="product-price">${getPriceDisplay(p)}</span>
                    </div>
                    ${p.preco > 0 ? (qty > 0 ? `<div class="flex items-center justify-center gap-4 bg-gray-100 p-2 text-black"><button onclick="changeQty('${p.id}',-1)">-</button><span>${qty}</span><button onclick="changeQty('${p.id}',1)">+</button></div>` : `<button class="btn-add" onclick="addToCart('${p.id}')">ADICIONAR</button>`) : `<button class="btn-add opacity-30" disabled>ESGOTADO</button>`}
                </div>`;
            }).join('');
        }

        /* BIZU: CARRINHO E WHATSAPP */
        function addToCart(id) {
            const p = database.find(i => i.id === id);
            cart.push({...p, qty: 1});
            updateBadge();
            displayProducts(database, false);
        }
        function changeQty(id, delta) {
            const idx = cart.findIndex(i => i.id === id);
            if(idx > -1) {
                cart[idx].qty += delta;
                if(cart[idx].qty <= 0) cart.splice(idx, 1);
            }
            updateBadge();
            displayProducts(database, false);
            if(document.getElementById('cartModal').style.display === 'flex') renderCart();
        }
        function updateBadge() { document.getElementById('cartBadge').innerText = cart.reduce((a, b) => a + b.qty, 0); }
        function openCartModal() { renderCart(); document.getElementById('cartModal').classList.add('open'); document.getElementById('cartModal').style.display = 'flex'; }
        function renderCart() {
            let total = 0;
            document.getElementById('cartSummaryList').innerHTML = cart.map(i => {
                const price = i.promocao > 0 ? i.promocao : i.preco;
                total += price * i.qty;
                return `<div class="flex justify-between py-4 border-b"><span>${i.qty}x ${i.nome}</span><span>R$ ${(price*i.qty).toFixed(2)}</span></div>`;
            }).join('');
            document.getElementById('cartSummaryTotal').innerText = `R$ ${total.toFixed(2)}`;
        }
        function finalizeOrder() {
            let msg = "Olá! Gostaria de fazer um pedido:\n\n";
            cart.forEach(i => msg += `• ${i.qty}x ${i.nome}\n`);
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        /* BIZU: INTERFACE GERAL */
        function openModal(id) {
            const p = database.find(i => i.id === id);
            document.getElementById('modalContent').innerHTML = `
                <img src="${p.imagem}" class="h-60 mx-auto mb-6 object-contain">
                <h2 class="font-luxury text-2xl text-center mb-2">${p.nome}</h2>
                <p class="text-center text-gray-500 mb-6 italic px-4">"${p.descricao}"</p>
                <div class="text-center text-xl mb-6">${getPriceDisplay(p)}</div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }
        function closeModal(id) { 
            if(id === 'cartModal') { document.getElementById(id).classList.remove('open'); setTimeout(() => document.getElementById(id).style.display='none', 400); }
            else { document.getElementById(id).style.display = 'none'; }
        }
        function closeModalExterno(e, id) { if(e.target.id === id) closeModal(id); }
        function toggleSidebar(open) {
            document.getElementById('sidebar').style.left = open ? '0' : '-300px';
            document.getElementById('sidebarOverlay').style.display = open ? 'block' : 'none';
        }

        window.addEventListener('load', () => {
            loadSheetData();
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 800);
            }, 2000);
        });
    </script>
</body>
</html>
