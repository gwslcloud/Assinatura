<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Título da aba alterado conforme pedido -->
    <title>Assinatura Perfume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-logo: #002218;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #000b08; 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        
        /* Botão Dourado com ajuste de tamanho de fonte responsivo */
        .btn-gold {
            background: linear-gradient(135deg, var(--dourado-logo), var(--dourado-brilho));
            color: #000;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        /* Card Luxo */
        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(197, 160, 89, 0.15);
            border-radius: 4px;
            transition: transform 0.3s ease, border 0.3s ease;
        }
        @media (min-width: 1024px) {
            .product-card:hover {
                transform: translateY(-8px);
                border-color: var(--dourado-logo);
            }
        }

        /* Container de Imagem Otimizado */
        .img-container {
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            border-radius: 2px;
        }
        @media (min-width: 768px) { .img-container { height: 320px; } }

        .img-container img {
            max-height: 90%;
            max-width: 90%;
            object-fit: contain;
            padding: 10px;
        }

        /* Menu de marcas - Scroll no mobile, Lista no desktop */
        @media (max-width: 767px) {
            .brand-menu {
                display: flex;
                overflow-x: auto;
                white-space: nowrap;
                gap: 15px;
                padding-bottom: 10px;
            }
            .brand-menu::-webkit-scrollbar { display: none; }
        }

        /* WhatsApp Flutuante */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 20px;
            background-color: #25d366;
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 1000;
            border: 2px solid var(--dourado-logo);
            animation: pulse 2s infinite;
        }
        @media (min-width: 1024px) {
            .whatsapp-float { width: 65px; height: 65px; bottom: 40px; right: 40px; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="pb-20">

    <!-- WhatsApp Flutuante -->
    <a href="https://wa.me/5595984165133" class="whatsapp-float" target="_blank" aria-label="Contato via WhatsApp">
        <svg width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
        </svg>
    </a>

    <!-- Header Centralizado -->
    <header class="py-12 flex flex-col items-center px-4">
        <img src="assinatura.jpeg" alt="Assinatura Perfume" class="w-60 md:w-80 mb-6 drop-shadow-[0_0_20px_rgba(197,160,89,0.3)] transition-all">
        <div class="h-[1px] w-24 bg-gradient-to-r from-transparent via-[#c5a059] to-transparent mb-6"></div>
        <nav class="flex space-x-8 md:space-x-12 text-[11px] md:text-sm tracking-[0.3em] uppercase text-gray-400">
            <a href="#" class="hover:text-gold transition">Catálogo</a>
            <a href="#" class="hover:text-gold transition">Masculinos</a>
            <a href="#" class="hover:text-gold transition">Femininos</a>
        </nav>
    </header>

    <!-- Barra de Busca Proporcional -->
    <div class="container mx-auto px-6 mb-16">
        <div class="max-w-2xl mx-auto border-b border-gold/30">
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="BUSQUE UMA FRAGRÂNCIA..." 
                class="w-full bg-transparent py-4 text-center text-lg md:text-2xl font-light focus:outline-none placeholder:text-gray-700 tracking-widest text-white uppercase">
        </div>
    </div>

    <main class="container mx-auto px-6 flex flex-col md:flex-row gap-12">
        
        <!-- Lateral de Marcas -->
        <aside class="w-full md:w-1/4">
            <h3 class="hidden md:block font-luxury text-gold text-xl mb-8 tracking-widest uppercase border-b border-gold/10 pb-4">Marcas</h3>
            <ul class="brand-menu text-xs md:text-sm tracking-[0.2em] text-gray-400 uppercase font-medium md:space-y-6">
                <li class="cursor-pointer hover:text-gold transition-all border border-gold/20 md:border-0 px-5 py-2 md:p-0 rounded-full" onclick="filterByBrand('Todos')">Todos</li>
                <li class="cursor-pointer hover:text-gold transition-all border border-gold/20 md:border-0 px-5 py-2 md:p-0 rounded-full" onclick="filterByBrand('Khadlaj')">Khadlaj</li>
                <li class="cursor-pointer hover:text-gold transition-all border border-gold/20 md:border-0 px-5 py-2 md:p-0 rounded-full" onclick="filterByBrand('Maison Alhambra')">Alhambra</li>
                <li class="cursor-pointer hover:text-gold transition-all border border-gold/20 md:border-0 px-5 py-2 md:p-0 rounded-full" onclick="filterByBrand('Lattafa')">Lattafa</li>
            </ul>
        </aside>

        <!-- Catálogo Principal -->
        <section class="w-full md:w-3/4">
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10">
                <!-- Injetado via JS -->
            </div>
        </section>
    </main>

    <footer class="mt-24 py-12 border-t border-white/5 text-center">
        <p class="text-[10px] md:text-xs tracking-[0.5em] text-gray-600 uppercase">Assinatura Perfume © 2024</p>
    </footer>

    <script>
        const database = [
            {
                marca: "Khadlaj",
                nome: "Oud Al Sabah 100ml",
                preco: "100,00",
                imagem: "perfume1.webp",
                whatsapp: "5595984165133"
            },
            {
                marca: "Maison Alhambra",
                nome: "So Glam Rouge Intense 100ml",
                preco: "200,00",
                imagem: "perfume2.jpeg",
                whatsapp: "5595984165133"
            },
            {
                marca: "Lattafa",
                nome: "Asad 100ml",
                preco: "400,00",
                imagem: "perfume3.webp",
                whatsapp: "5595984165133"
            }
        ];

        const grid = document.getElementById('productGrid');

        function displayProducts(products) {
            grid.innerHTML = products.map(p => `
                <div class="product-card p-5 md:p-6 flex flex-col h-full">
                    <div class="img-container mb-8">
                        <img src="${p.imagem}" alt="${p.nome}" loading="lazy">
                    </div>
                    
                    <div class="flex-grow text-center px-2">
                        <p class="text-[10px] md:text-xs text-gold tracking-widest uppercase mb-2 opacity-70">${p.marca}</p>
                        <h2 class="font-luxury text-sm md:text-lg mb-4 h-12 md:h-16 overflow-hidden leading-snug tracking-wide uppercase">${p.nome}</h2>
                        <p class="text-xl md:text-2xl font-light mb-8 text-white/90">R$ ${p.preco}</p>
                    </div>

                    <a href="https://wa.me/${p.whatsapp}?text=Olá! Gostaria de encomendar o perfume ${p.nome}" target="_blank" 
                       class="btn-gold py-4 md:py-5 text-center text-[10px] md:text-xs rounded-sm active:scale-95">
                        COMPRAR NO WHATSAPP
                    </a>
                </div>
            `).join('');
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = database.filter(p => p.nome.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term));
            displayProducts(filtered);
        }

        function filterByBrand(brand) {
            if(brand === 'Todos') {
                displayProducts(database);
            } else {
                const filtered = database.filter(p => p.marca === brand);
                displayProducts(filtered);
            }
            if(window.innerWidth < 768) {
                window.scrollTo({ top: 400, behavior: 'smooth' });
            }
        }

        displayProducts(database);
    </script>
</body>
</html>
