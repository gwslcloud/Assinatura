<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Perfume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-logo: #002218;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #000b08; 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        
        /* TELA DE BOAS-VINDAS */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000b08;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .splash-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .mist-effect {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.4) 0%, transparent 70%);
            filter: blur(15px);
            border-radius: 50%;
            z-index: 1;
            animation: mist-breathe 2.5s infinite ease-in-out;
        }
        @keyframes mist-breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.7; }
        }
        .welcome-text {
            color: var(--dourado-logo);
            letter-spacing: 0.6em;
            font-size: 11px;
            font-weight: 400;
            z-index: 11;
            margin-top: -135px; 
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.4);
        }

        /* --- ESTILO DA PÁGINA --- */
        .golden-line-bg {
            position: absolute;
            top: 85px; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(197, 160, 89, 0.1) 15%, rgba(197, 160, 89, 0.8) 50%, rgba(197, 160, 89, 0.1) 85%, transparent 100%);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
            z-index: 1;
        }
        .header-container {
            position: relative;
            padding: 0.5rem 1rem 0 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .logo-main { width: 150px; position: relative; z-index: 5; margin-bottom: -55px; margin-top: -10px; }
        
        .search-area { padding: 0 1.5rem 1rem 1.5rem; position: relative; z-index: 11; }
        .search-input {
            width: 100%; background: transparent; border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding: 4px 0; outline: none; text-transform: uppercase; font-size: 10px;
            color: #fff; letter-spacing: 2px; text-align: center; font-weight: 300;
        }

        .brand-scroll {
            display: flex; overflow-x: auto; gap: 12px; padding: 0.5rem 1.5rem 1.5rem 1.5rem;
            scrollbar-width: none; justify-content: center;
        }
        .brand-item {
            font-family: 'Cinzel', serif; border: 0.5px solid rgba(197, 160, 89, 0.4);
            padding: 4px 12px; font-size: 8px; text-transform: uppercase;
            color: var(--dourado-logo); background: rgba(197, 160, 89, 0.03); white-space: nowrap;
        }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 15px; }
        .product-card {
            background: rgba(255,255,255,0.01); border: 1px solid rgba(197, 160, 89, 0.05);
            padding: 12px 8px; text-align: center; display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-img { height: 140px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .product-img img { max-height: 100%; object-fit: contain; }
        .product-brand { font-size: 9px; color: var(--dourado-logo); text-transform: uppercase; margin-bottom: 3px; letter-spacing: 1px; opacity: 0.8; }
        .product-name { font-size: 12px; font-weight: 500; text-transform: uppercase; line-height: 1.2; height: 2.4em; overflow: hidden; margin-bottom: 6px; color: #eee; }
        .product-price { font-size: 14px; font-weight: 400; color: #fff; margin-bottom: 10px; }

        /* SELETOR DE QUANTIDADE */
        .qty-selector {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: rgba(255,255,255,0.05); border-radius: 4px; padding: 5px; margin-bottom: 10px;
        }
        .qty-btn {
            width: 25px; height: 25px; display: flex; align-items: center; justify-content: center;
            background: var(--dourado-logo); color: #000; border-radius: 50%; font-weight: bold;
        }
        .qty-value { font-size: 14px; font-weight: 600; width: 20px; }

        .btn-add {
            background: linear-gradient(135deg, var(--dourado-logo), var(--dourado-brilho));
            color: #000; width: 100%; padding: 10px 0; font-weight: 700; font-size: 10px; text-transform: uppercase;
        }

        /* CARRINHO FLUTUANTE (ÍCONE BRANCO) */
        .cart-float {
            position: fixed; bottom: 20px; right: 15px; background: var(--dourado-logo);
            width: 55px; height: 55px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); border: 2px solid #000;
        }
        .cart-float svg { fill: #fff; } /* Ícone em branco */
        
        .cart-count {
            position: absolute; top: -2px; right: -2px; background: #ff0000;
            color: #fff; font-size: 10px; width: 20px; height: 20px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: bold; border: 1px solid #fff;
        }

        footer { text-align: center; padding: 50px 20px; margin-top: 30px; border-top: 1px solid rgba(197, 160, 89, 0.1); }
        .footer-title { color: var(--dourado-logo); font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 8px; }
        .footer-subtitle { color: #555; font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-wrapper">
            <div class="mist-effect"></div>
            <div class="flex flex-col items-center">
                <img src="assinatura.png" alt="Logo" class="w-[280px] z-10 relative">
                <h1 class="font-luxury welcome-text">SEJA BEM VINDO</h1>
            </div>
        </div>
    </div>

    <div class="golden-line-bg"></div>

    <header class="header-container">
        <img src="assinatura.png" alt="Logo" class="logo-main">
    </header>

    <div class="search-area">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="BUSQUE SUA FRAGRÂNCIA..." class="search-input">
    </div>

    <div class="brand-scroll">
        <div class="brand-item" onclick="filterByBrand('Todos')">TODOS</div>
        <div class="brand-item" onclick="filterByBrand('Khadlaj')">KHADLAJ</div>
        <div class="brand-item" onclick="filterByBrand('Maison Alhambra')">ALHAMBRA</div>
        <div class="brand-item" onclick="filterByBrand('Lattafa')">LATTAFA</div>
    </div>

    <main class="product-grid" id="productGrid"></main>

    <footer>
        <div class="footer-title font-luxury">Assinatura Parfum 2026</div>
        <div class="footer-subtitle">BOA VISTA - RR</div>
    </footer>

    <div class="cart-float" onclick="sendToWhatsApp()">
        <svg width="25" height="25" viewBox="0 0 16 16">
            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l.84 4.479 9.144-.459L13.89 4H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        <div class="cart-count" id="cartBadge">0</div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.transition = 'opacity 0.8s ease';
                splash.style.opacity = '0'; 
                setTimeout(() => { splash.remove(); }, 800);
            }, 2500); 
        });

        const database = [
            { id: 0, marca: "Khadlaj", nome: "Oud Al Sabah 100ml", preco: 100.00, imagem: "perfume1.webp" },
            { id: 1, marca: "Maison Alhambra", nome: "So Glam Rouge Intense 100ml", preco: 200.00, imagem: "perfume2.jpeg" },
            { id: 2, marca: "Lattafa", nome: "Asad 100ml", preco: 400.00, imagem: "perfume3.webp" },
            { id: 3, marca: "Lattafa", nome: "Yara 100ml", preco: 350.00, imagem: "yara.webp" },
            { id: 4, marca: "Maison Alhambra", nome: "Lovely Cherry 80ml", preco: 280.00, imagem: "cherry.webp" },
            { id: 5, marca: "Khadlaj", nome: "Shiyaaka 100ml", preco: 320.00, imagem: "shiyaaka.webp" }
        ];

        let cart = [];
        const whatsappNumber = "5595991154395";

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => {
                const cartItem = cart.find(item => item.id === p.id);
                const currentQty = cartItem ? cartItem.qty : 1;
                const btnText = cartItem ? "Atualizar" : "Adicionar";

                return `
                <div class="product-card">
                    <div>
                        <div class="product-img">
                            <img src="${p.imagem}" alt="${p.nome}" onerror="this.src='assinatura.png'">
                        </div>
                        <p class="product-brand">${p.marca}</p>
                        <h2 class="product-name font-luxury">${p.nome}</h2>
                    </div>
                    <div>
                        <p class="product-price">R$ ${p.preco.toFixed(2).replace('.', ',')}</p>
                        <div class="qty-selector">
                            <button class="qty-btn" onclick="changeQty(${p.id}, -1)">-</button>
                            <span class="qty-value" id="qty-${p.id}">${currentQty}</span>
                            <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
                        </div>
                        <button class="btn-add" id="btn-${p.id}" onclick="addToCart(${p.id})">${btnText}</button>
                    </div>
                </div>
            `}).join('');
        }

        function changeQty(id, delta) {
            const el = document.getElementById(`qty-${id}`);
            let val = parseInt(el.innerText);
            val = Math.max(0, val + delta); // Permite chegar a 0 para remover
            el.innerText = val;

            // Lógica de esvaziar/remover se chegar a 0
            const cartIndex = cart.findIndex(item => item.id === id);
            if (cartIndex > -1) {
                if (val === 0) {
                    cart.splice(cartIndex, 1);
                    document.getElementById(`btn-${id}`).innerText = "Adicionar";
                } else {
                    cart[cartIndex].qty = val;
                }
                updateBadge();
            }
        }

        function addToCart(id) {
            const product = database.find(p => p.id === id);
            const qty = parseInt(document.getElementById(`qty-${id}`).innerText);
            
            if(qty === 0) {
                alert("Selecione ao menos 1 unidade.");
                return;
            }

            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty = qty;
            } else {
                cart.push({ ...product, qty: qty });
            }
            
            document.getElementById(`btn-${id}`).innerText = "Atualizar";
            updateBadge();
        }

        function updateBadge() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartBadge').innerText = totalItems;
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }

            let message = "Olá! Gostaria de fazer um pedido:\n\n";
            let totalOrder = 0;

            cart.forEach(item => {
                let subtotal = item.preco * item.qty;
                message += `*${item.qty}x ${item.nome}*\n`;
                message += `Unid: R$ ${item.preco.toFixed(2)} | Sub: R$ ${subtotal.toFixed(2)}\n\n`;
                totalOrder += subtotal;
            });

            message += `*TOTAL DO PEDIDO: R$ ${totalOrder.toFixed(2)}*`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            displayProducts(database.filter(p => p.nome.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term)));
        }

        function filterByBrand(brand) {
            brand === 'Todos' ? displayProducts(database) : displayProducts(database.filter(p => p.marca.toUpperCase() === brand.toUpperCase()));
        }

        displayProducts(database);
    </script>
</body>
</html>
