<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Perfume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-logo: #002218;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #000b08; 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        
        /* TELA DE BOAS-VINDAS (SPLASH SCREEN) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000b08;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .splash-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* EFEITO DE PULSO SOFISTICADO (AURA) */
        .pulse-effect {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
            animation: luxury-pulse 2.5s infinite ease-in-out;
        }

        @keyframes luxury-pulse {
            0% { transform: scale(0.8); opacity: 0.2; }
            50% { transform: scale(1.5); opacity: 0.6; }
            100% { transform: scale(2); opacity: 0; }
        }

        .pulse-logo {
            width: 280px; /* Aumentado como solicitado */
            z-index: 10;
            position: relative;
            display: block;
        }

        .welcome-text {
            color: var(--dourado-logo);
            letter-spacing: 0.6em;
            font-size: 12px;
            font-weight: 400;
            z-index: 11;
            /* A MARGEM NEGATIVA ABAIXO ELIMINA O ESPAÇO QUE VOCÊ PINTOU DE VERMELHO */
            margin-top: -110px; 
            text-shadow: 0 0 15px rgba(197, 160, 89, 0.4);
            animation: fade-up 2s ease-out forwards;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CONFIGURAÇÃO DO SITE (HEADER) */
        .logo-left {
            width: 130px;
            margin-bottom: -15px; /* Puxa o menu para cima */
        }

        .header-container {
            padding: 1.5rem 1.5rem 0 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: #888;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(197, 160, 89, 0.1);
            width: 100%;
            padding-bottom: 10px;
        }

        /* BARRA DE BUSCA E MARCAS PROPORCIONAIS */
        .search-area {
            padding: 1.5rem;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            padding: 8px 0;
            outline: none;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .brand-scroll {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 0 1.5rem 1.5rem 1.5rem;
            scrollbar-width: none;
        }
        .brand-scroll::-webkit-scrollbar { display: none; }

        .brand-item {
            border: 1px solid rgba(197, 160, 89, 0.2);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 10px;
            text-transform: uppercase;
            white-space: nowrap;
            color: #999;
        }

        /* CARDS DE PRODUTOS */
        .product-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(197, 160, 89, 0.1);
            padding: 15px;
            text-align: center;
        }

        .product-img {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .product-img img { max-height: 100%; object-fit: contain; }

        .btn-buy {
            background: linear-gradient(135deg, var(--dourado-logo), var(--dourado-brilho));
            color: #000;
            width: 100%;
            padding: 10px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #25d366;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-wrapper">
            <div class="pulse-effect"></div>
            <img src="assinatura.png" alt="Logo" class="pulse-logo">
            <h1 class="font-luxury welcome-text">SEJA BEM VINDO</h1>
        </div>
    </div>

    <!-- SITE -->
    <header class="header-container">
        <img src="assinatura.png" alt="Logo" class="logo-left">
        <nav class="nav-links">
            <a href="#">Catálogo</a>
            <a href="#">Masculinos</a>
            <a href="#">Femininos</a>
        </nav>
    </header>

    <div class="search-area">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Busque seu perfume..." class="search-input">
    </div>

    <div class="brand-scroll">
        <div class="brand-item" onclick="filterByBrand('Todos')">Todos</div>
        <div class="brand-item" onclick="filterByBrand('Khadlaj')">Khadlaj</div>
        <div class="brand-item" onclick="filterByBrand('Maison Alhambra')">Alhambra</div>
        <div class="brand-item" onclick="filterByBrand('Lattafa')">Lattafa</div>
    </div>

    <main class="px-6 grid grid-cols-1 gap-6" id="productGrid"></main>

    <a href="https://wa.me/5595991154395" class="whatsapp-float">
        <svg width="24" height="24" fill="white" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>
    </a>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.transition = 'opacity 0.6s ease';
                splash.style.opacity = '0'; 
                setTimeout(() => { splash.remove(); }, 600);
            }, 2500); 
        });

        const database = [
            { marca: "Khadlaj", nome: "Oud Al Sabah 100ml", preco: "100,00", imagem: "perfume1.webp", whatsapp: "5595991154395" },
            { marca: "Maison Alhambra", nome: "So Glam Rouge Intense 100ml", preco: "200,00", imagem: "perfume2.jpeg", whatsapp: "5595991154395" },
            { marca: "Lattafa", nome: "Asad 100ml", preco: "400,00", imagem: "perfume3.webp", whatsapp: "5595991154395" }
        ];

        const grid = document.getElementById('productGrid');

        function displayProducts(products) {
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-img"><img src="${p.imagem}" alt="${p.nome}" onerror="this.src='assinatura.png'"></div>
                    <p class="text-[8px] text-gold uppercase tracking-widest mb-1">${p.marca}</p>
                    <h2 class="font-luxury text-xs uppercase mb-2">${p.nome}</h2>
                    <p class="text-lg font-light">R$ ${p.preco}</p>
                    <a href="https://wa.me/${p.whatsapp}" target="_blank" class="btn-buy block">Comprar WhatsApp</a>
                </div>
            `).join('');
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            displayProducts(database.filter(p => p.nome.toLowerCase().includes(term)));
        }

        function filterByBrand(brand) {
            brand === 'Todos' ? displayProducts(database) : displayProducts(database.filter(p => p.marca === brand));
        }

        displayProducts(database);
    </script>
</body>
</html>
