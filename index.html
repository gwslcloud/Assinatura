<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Parfum</title>
    
    <!-- ÍCONE DA ABA DO NAVEGADOR -->
    <link rel="icon" type="image/png" href="assinatura.png">
    
    <!-- FRAMEWORKS E FONTES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           BIZU: CORES E FUNDO PARALLAX SUTIL
           ============================================================ */
        :root {
            --verde-fundo: #00160f; 
            --verde-detalhe: #002419;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde-fundo); 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
        }

        /* EFEITO PARALLAX SUTIL NO FUNDO */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(197, 160, 89, 0.03) 0%, transparent 70%);
            z-index: -1;
            animation: backgroundFloat 15s infinite alternate ease-in-out;
            pointer-events: none;
        }
        @keyframes backgroundFloat {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .font-luxury { font-family: 'Cinzel', serif; }

        /* BIZU: TAG "MAIS VENDIDO" */
        .badge-best-seller {
            position: absolute;
            top: 10px; left: 10px;
            background: linear-gradient(90deg, #8b6d31, #c5a059);
            color: white; font-size: 8px; font-weight: 700;
            padding: 4px 8px; border-radius: 4px;
            display: flex; align-items: center; gap: 4px; z-index: 20;
            text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
        }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--verde-fundo);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .mist-effect {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.4) 0%, transparent 70%);
            filter: blur(15px); border-radius: 50%; z-index: 1;
            animation: mist-breathe 2.5s infinite ease-in-out;
        }
        @keyframes mist-breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.7; }
        }
        .welcome-text {
            color: var(--dourado-logo); letter-spacing: 0.6em; font-size: 11px;
            font-weight: 400; z-index: 11; margin-top: -135px; 
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.4); text-align: center;
        }

        /* HEADER E BUSCA */
        .header-container {
            position: relative; padding: 0.5rem 1rem 0 1rem;
            display: flex; flex-direction: column; align-items: center; z-index: 10;
        }
        .logo-main { width: 150px; position: relative; z-index: 5; margin-bottom: -55px; margin-top: -10px; }
        .search-area { padding: 1rem 1.5rem; position: relative; z-index: 11; }
        .search-container {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid rgba(197, 160, 89, 0.2); border-radius: 50px;
            padding: 10px 20px; display: flex; align-items: center;
        }
        .search-input {
            width: 100%; background: transparent; border: none; outline: none; 
            text-transform: uppercase; font-size: 11px; color: #fff; 
            letter-spacing: 2px; text-align: center; font-weight: 300;
        }

        /* GRID E CARDS COM MICRO-INTERAÇÃO */
        .product-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 20px; padding: 0 15px; 
        }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, 1fr); max-width: 1400px; margin: 0 auto; gap: 30px; } }

        .product-card {
            position: relative; background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(197, 160, 89, 0.08); padding: 20px 15px; 
            text-align: center; display: flex; flex-direction: column; justify-content: space-between;
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .product-card.visible { opacity: 1; transform: translateY(0); }

        .product-img { height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; cursor: pointer; }
        .product-img img { max-height: 100%; object-fit: contain; }
        .product-brand { font-size: 9px; color: var(--dourado-logo); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 2px; }
        .product-name { font-size: 13px; font-weight: 400; text-transform: uppercase; line-height: 1.3; height: 2.6em; overflow: hidden; margin-bottom: 10px; color: #fff; letter-spacing: 1px; }
        .product-price { font-size: 15px; font-weight: 300; color: #fff; margin-bottom: 18px; letter-spacing: 1px; }

        /* BOTÕES E QUANTIDADE */
        .btn-add {
            background: #ffffff; color: #000; width: 100%; padding: 12px 0; border: 1px solid #ffffff;
            font-family: 'Cinzel', serif; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: 0.4s;
        }
        .qty-selector { display: flex; align-items: center; justify-content: center; gap: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(197, 160, 89, 0.2); padding: 10px 5px; }
        .qty-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: #fff; color: #000; border-radius: 50%; font-weight: bold; }

        /* MODAIS */
        #productModal, #cartModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 200; backdrop-filter: blur(8px);
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-container {
            background: var(--verde-fundo); border: 1px solid var(--dourado-logo); width: 100%; max-width: 450px;
            padding: 40px 25px; position: relative; max-height: 90vh; overflow-y: auto;
        }
        .close-modal { position: absolute; top: 5px; right: 15px; color: #ff0000 !important; font-size: 45px; cursor: pointer; z-index: 300; line-height: 1; font-weight: bold; }

        /* PIRÂMIDE OLFATIVA PREMIUM */
        .pyramid-section { border-top: 1px solid rgba(197, 160, 89, 0.1); margin-top: 25px; padding-top: 20px; text-align: left; }
        .pyramid-title { font-family: 'Cinzel', serif; color: var(--dourado-logo); font-size: 11px; letter-spacing: 2px; text-align: center; margin-bottom: 15px; display: block; }
        .note-item { margin-bottom: 12px; }
        .note-label { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 3px; }
        .note-content { font-size: 11px; color: #fff; font-weight: 300; }

        /* CARRINHO FLUTUANTE */
        .cart-float { position: fixed; bottom: 30px; right: 20px; background: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 100; box-shadow: 0 6px 25px rgba(0,0,0,0.7); cursor: pointer; }
        .cart-count { position: absolute; top: 0px; right: 0px; background: #ff0000; color: #fff; font-size: 11px; width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #fff; }

        #sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background-color: var(--verde-fundo); z-index: 3000; transition: left 0.4s cubic-bezier(0.23, 1, 0.32, 1); border-right: 1px solid rgba(197, 160, 89, 0.3); }
        #sidebar.open { left: 0; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 2999; display: none; }
        .menu-hamburger { min-width: 45px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid rgba(197, 160, 89, 0.2); background: rgba(255,255,255,0.02); border-radius: 4px; margin-left: 15px; }
    </style>
</head>
<body>

    <div id="luxuryToast" style="visibility: hidden; min-width: 300px; background-color: var(--verde-detalhe); color: #fff; text-align: center; border: 1px solid var(--dourado-logo); padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 100px; transform: translateX(-50%); font-family: 'Cinzel', serif;"></div>

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>
    <nav id="sidebar">
        <div class="sidebar-header flex justify-between items-center p-6 border-b border-[rgba(197,160,89,0.2)]">
            <span class="font-luxury text-sm text-white tracking-widest">MENU</span>
            <span class="text-2xl cursor-pointer text-white" onclick="toggleSidebar(false)">&times;</span>
        </div>
        <div id="sidebarOriginsList" class="overflow-y-auto"></div>
    </nav>

    <div id="splash-screen">
        <div class="splash-wrapper relative flex flex-col items-center">
            <div class="mist-effect"></div>
            <img src="assinatura.png" alt="Logo" class="w-[280px] z-10 relative">
            <h1 class="font-luxury welcome-text">SEJA BEM VINDO</h1>
        </div>
    </div>

    <header class="header-container">
        <img src="assinatura.png" alt="Logo" class="logo-main">
    </header>

    <div class="search-area">
        <div class="search-container">
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="BUSQUE SUA FRAGRÂNCIA..." class="search-input">
        </div>
    </div>

    <div class="flex items-center mb-4">
        <div class="menu-hamburger" onclick="toggleSidebar(true)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c5a059" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </div>
        <div id="brandMenu" class="flex-1 flex overflow-x-auto gap-3 px-4 scrollbar-hide"></div>
    </div>

    <main class="product-grid" id="productGrid"></main>

    <div id="productModal" onclick="closeModalExterno(event, 'productModal')">
        <div class="modal-container" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModal('productModal')">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <div id="cartModal" onclick="closeModalExterno(event, 'cartModal')">
        <div class="modal-container" onclick="event.stopPropagation()" style="background:#fff; color:#000;">
            <span class="close-modal" onclick="closeModal('cartModal')">&times;</span>
            <h2 class="font-luxury text-xl text-center mb-6 py-8 bg-[#00160f] text-white">RESUMO DO PEDIDO</h2>
            <div id="cartSummaryList" class="px-6"></div>
            <div class="mt-6 flex justify-between items-center font-bold px-6">
                <span class="text-sm tracking-widest text-gray-500">TOTAL:</span>
                <span id="cartSummaryTotal" class="text-xl">R$ 0,00</span>
            </div>
            <div class="px-6 pb-8">
                <button class="btn-add mt-8 bg-black text-white" onclick="finalizeOrder()">FINALIZAR NO WHATSAPP</button>
            </div>
        </div>
    </div>

    <div class="cart-float" onclick="openCartModal()">
        <svg width="28" height="28" viewBox="0 0 16 16"><path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5z"/></svg>
        <div class="cart-count" id="cartBadge">0</div>
    </div>

    <script>
        const BASE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0crXc21GaE7jllSoyZqiE5xIa7lGGvtKEFjbK-0oil1dQWdMwcz6cRpH70qPbWMwzZF1KlLEP8d83/pub?gid=0&single=true&output=csv'; 
        let database = []; let cart = []; let isMaintenance = false;
        const whatsappNumber = "5595991154395";

        async function loadSheetData() {
            try {
                const response = await fetch(BASE_SHEET_URL + '&t=' + new Date().getTime());
                const data = await response.text();
                const allRows = data.split(/\r?\n/);
                const headers = allRows[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                // M1 (Coluna M, Índice 12)
                if (headers[12]?.replace(/"/g, '').trim() === "0") {
                    isMaintenance = true;
                    document.querySelector('.welcome-text').innerText = "Desculpa! Site em manutenção";
                    return;
                }

                database = allRows.slice(1).map(row => {
                    const col = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    return {
                        id: col[0]?.replace(/"/g, '').trim(),
                        marca: col[1]?.replace(/"/g, '').trim(),
                        origem: col[2]?.replace(/"/g, '').trim(),
                        nome: col[3]?.replace(/"/g, '').trim(),
                        preco: parseFloat(col[4]?.replace(/"/g, '').replace(',', '.').trim() || 0),
                        promocao: parseFloat(col[5]?.replace(/"/g, '').replace(',', '.').trim() || 0),
                        imagem: col[6]?.replace(/"/g, '').trim(),
                        descricao: col[7]?.replace(/"/g, '').trim() || "Fragrância exclusiva.",
                        maisVendido: col[8]?.trim() === "1",
                        topo: col[9]?.replace(/"/g, '').trim(),
                        coracao: col[10]?.replace(/"/g, '').trim(),
                        base: col[11]?.replace(/"/g, '').trim()
                    };
                }).filter(p => p.nome);

                generateMenus(database);
                displayProducts(database);
            } catch (e) { console.error(e); }
        }

        function generateMenus(data) {
            const hMenu = document.getElementById('brandMenu');
            const sMenu = document.getElementById('sidebarOriginsList');
            const brands = [...new Set(data.map(p => p.marca))].sort();
            const origins = [...new Set(data.map(p => p.origem))].sort();

            hMenu.innerHTML = `<div class="brand-item active" onclick="filterByBrand('Todos', this)">TODOS</div>` + 
                brands.map(b => `<div class="brand-item" onclick="filterByBrand('${b}', this)">${b.toUpperCase()}</div>`).join('');

            sMenu.innerHTML = origins.map((o, i) => {
                const subId = `sub_${i}`;
                const bInO = [...new Set(data.filter(p => p.origem === o).map(p => p.marca))].sort();
                return `<div class="p-6 text-white font-luxury text-xs tracking-widest cursor-pointer border-b border-[rgba(197,160,89,0.05)] flex justify-between items-center" onclick="toggleSub('${subId}')">${o.toUpperCase()} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
                <div id="${subId}" class="hidden bg-[rgba(0,0,0,0.2)]">
                    <div class="p-4 pl-10 text-[10px] text-gray-400 uppercase cursor-pointer" onclick="filterByOrigin('${o}'); toggleSidebar(false)">VER TODOS</div>
                    ${bInO.map(b => `<div class="p-4 pl-10 text-[10px] text-gray-400 uppercase cursor-pointer" onclick="filterByBrand('${b}'); toggleSidebar(false)">${b.toUpperCase()}</div>`).join('')}
                </div>`;
            }).join('');
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => {
                const qty = (cart.find(i => i.id === p.id))?.qty || 0;
                const pDisp = p.preco <= 0 ? '<span class="text-red-500">INDISPONÍVEL</span>' : 
                    (p.promocao > 0 ? `<span style="text-decoration:line-through; opacity:0.5; font-size:0.9em; white-space:nowrap;">R$ ${p.preco.toFixed(2).replace('.',',')}</span><br><span style="color:#ff4d4d; font-weight:700; white-space:nowrap;">R$ ${p.promocao.toFixed(2).replace('.',',')}</span>` : `R$ ${p.preco.toFixed(2).replace('.',',')}`);
                const btn = p.preco > 0 ? (qty > 0 ? `<div class="qty-selector"><button class="qty-btn" onclick="changeQty('${p.id}',-1)">-</button><span>${qty}</span><button class="qty-btn" onclick="changeQty('${p.id}',1)">+</button></div>` : `<button class="btn-add" onclick="addToCart('${p.id}')">ADICIONAR AO CARRINHO</button>`) : `<button class="btn-add opacity-50" disabled>ESGOTADO</button>`;
                return `<div class="product-card" id="card_${p.id}">${p.maisVendido ? '<div class="badge-best-seller">★ Mais vendido</div>' : ''}<div onclick="openModal('${p.id}')"><div class="product-img"><img src="${p.imagem}" onerror="this.src='assinatura.png'"></div><p class="product-brand">${p.marca}</p><h2 class="product-name font-luxury">${p.nome}</h2></div><p class="product-price">${pDisp}</p>${btn}</div>`;
            }).join('');
            
            setTimeout(() => document.querySelectorAll('.product-card').forEach((c, i) => setTimeout(() => c.classList.add('visible'), i * 100)), 100);
        }

        function openModal(id) {
            const p = database.find(i => i.id === id);
            const qty = (cart.find(i => i.id === p.id))?.qty || 0;
            const pDisp = p.preco <= 0 ? '<span class="text-red-500">INDISPONÍVEL</span>' : (p.promocao > 0 ? `<span style="text-decoration:line-through; opacity:0.5;">R$ ${p.preco.toFixed(2)}</span><br><span style="color:#ff4d4d; font-weight:700;">R$ ${p.promocao.toFixed(2)}</span>` : `R$ ${p.preco.toFixed(2)}`);
            const btn = p.preco > 0 ? (qty > 0 ? `<div class="qty-selector mx-auto w-max mb-4"><button class="qty-btn" onclick="changeQty('${p.id}',-1); openModal('${p.id}')">-</button><span>${qty}</span><button class="qty-btn" onclick="changeQty('${p.id}',1); openModal('${p.id}')">+</button></div>` : `<button class="btn-add" onclick="addToCart('${p.id}'); openModal('${p.id}')">ADICIONAR AO CARRINHO</button>`) : '';
            const pyr = (p.topo || p.coracao || p.base) ? `<div class="pyramid-section"><span class="pyramid-title">PIRÂMIDE OLFATIVA</span>${p.topo ? `<div class="note-item"><span class="note-label">Topo</span><p class="note-content">${p.topo}</p></div>`:''}${p.coracao ? `<div class="note-item"><span class="note-label">Coração</span><p class="note-content">${p.coracao}</p></div>`:''}${p.base ? `<div class="note-item"><span class="note-label">Base</span><p class="note-content">${p.base}</p></div>`:''}</div>` : '';
            document.getElementById('modalContent').innerHTML = `<div class="flex justify-center mb-6 relative"><img src="${p.imagem}" class="h-56 object-contain" onerror="this.src='assinatura.png'"></div><p class="product-brand text-center">${p.marca}</p><h2 class="font-luxury text-2xl text-center text-white mb-3">${p.nome}</h2><p class="text-sm italic text-center text-gray-400 mb-6">"${p.descricao}"</p><p class="text-center text-white font-semibold text-xl mb-6">${pDisp}</p>${btn}${pyr}`;
            document.getElementById('productModal').style.display = 'flex';
        }

        function toggleSidebar(open) { document.getElementById('sidebar').classList.toggle('open', open); document.getElementById('sidebarOverlay').style.display = open ? 'block' : 'none'; }
        function toggleSub(id) { document.getElementById(id).classList.toggle('hidden'); }
        function filterByBrand(b, el) { if(el) { document.querySelectorAll('.brand-item').forEach(x => x.classList.remove('active')); el.classList.add('active'); } displayProducts(b === 'Todos' ? database : database.filter(p => p.marca === b)); }
        function filterByOrigin(o) { displayProducts(database.filter(p => p.origem === o)); }
        function filterProducts() { const t = document.getElementById('searchInput').value.toLowerCase(); displayProducts(database.filter(p => p.nome.toLowerCase().includes(t) || p.marca.toLowerCase().includes(t))); }
        function addToCart(id) { cart.push({...database.find(i => i.id === id), qty: 1}); updateBadge(); displayProducts(database); showToast("Boas compras", "item adicionado"); }
        function changeQty(id, d) { const i = cart.findIndex(x => x.id === id); if(i > -1) { cart[i].qty += d; if(cart[i].qty <= 0) cart.splice(i, 1); } updateBadge(); displayProducts(database); if(document.getElementById('cartModal').style.display === 'flex') renderCart(); }
        function updateBadge() { document.getElementById('cartBadge').innerText = cart.reduce((a, b) => a + b.qty, 0); }
        function openCartModal() { if(!cart.length) return; renderCart(); document.getElementById('cartModal').style.display = 'flex'; }
        function renderCart() { let total = 0; document.getElementById('cartSummaryList').innerHTML = cart.map(i => { const p = i.promocao > 0 ? i.promocao : i.preco; total += p * i.qty; return `<div class="flex justify-between items-center py-4 border-b"><div><p class="text-xs font-bold">${i.nome}</p><p class="text-[10px]">${i.qty}x R$ ${p.toFixed(2)}</p></div><div class="flex gap-2"><button class="qty-btn" onclick="changeQty('${i.id}',-1)">-</button><button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button></div></div>`; }).join(''); document.getElementById('cartSummaryTotal').innerText = `R$ ${total.toFixed(2).replace('.',',')}`; }
        function finalizeOrder() { let m = "Olá! Meu pedido:\n\n"; cart.forEach(i => m += `• ${i.qty}x ${i.nome}\n`); window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(m)}`); }
        function showToast(t, s) { const x = document.getElementById("luxuryToast"); x.innerHTML = `<span style="color:#c5a059">${t}</span><br>${s}`; x.style.visibility = "visible"; setTimeout(() => x.style.visibility = "hidden", 3000); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeModalExterno(e, id) { if(e.target.id === id) closeModal(id); }

        window.addEventListener('load', () => {
            loadSheetData().then(() => {
                if(!isMaintenance) setTimeout(() => { document.getElementById('splash-screen').style.opacity = '0'; setTimeout(() => document.getElementById('splash-screen').remove(), 1000); }, 2500);
            });
        });
    </script>
</body>
</html>
