<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Parfum</title>
    
    <!-- ÍCONE DA ABA DO NAVEGADOR -->
    <link rel="icon" type="image/png" href="assinatura.png">
    
    <!-- FRAMEWORKS E FONTES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           BIZU: CORES PRINCIPAIS DO SITE
           ============================================================ */
        :root {
            --verde-fundo: #00160f; 
            --verde-detalhe: #002419;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde-fundo); 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }

        /* TEXTURA DE RUÍDO (GRAIN) */
        .noise-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9998;
            opacity: 0.04;
            background-image: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
        }

        /* ELEMENTO CANVAS PARA A POEIRA DE OURO */
        #magicDustCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99999;
        }

        /* BARRA DE PROGRESSO DOURADA */
        #scrollProgress {
            position: fixed;
            top: 0; left: 0;
            width: 0%; height: 2px;
            background: linear-gradient(90deg, var(--dourado-logo), var(--dourado-brilho));
            z-index: 10000;
            box-shadow: 0 0 8px rgba(197, 160, 89, 0.5);
            transition: width 0.1s ease-out;
        }

        .font-luxury { font-family: 'Cinzel', serif; }

        /* BADGE "SELO DE LACRE" */
        .badge-best-seller {
            position: absolute;
            top: 10px;
            left: 10px;
            background: radial-gradient(circle at 30% 30%, #f1dca7, #c5a059 60%, #8b6d31);
            color: white;
            font-size: 7px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 20;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(0,0,0,0.15);
            box-shadow: 
                1px 2px 4px rgba(0,0,0,0.5), 
                inset 1px 1px 1px rgba(255,255,255,0.4),
                inset -1px -1px 1px rgba(0,0,0,0.2);
            text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
        }

        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, transform 0.8s ease;
            overflow: hidden;
        }

        .video-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle, transparent 20%, #000 95%),
                linear-gradient(to bottom, transparent 80%, #000 100%),
                linear-gradient(to top, transparent 80%, #000 100%);
            pointer-events: none;
            z-index: 10000;
        }

        #introVideo {
            width: 100%; height: 100%; object-fit: contain;
            filter: contrast(1.1) brightness(0.9);
            mix-blend-mode: lighten; 
        }

        .header-container {
            position: relative;
            padding: 0.8rem 1rem 0.2rem 1rem; 
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            overflow: hidden; 
            background: linear-gradient(to bottom, #001f15 0%, var(--verde-fundo) 100%);
            min-height: 85px; 
        }

        .luxury-line-container {
            flex-grow: 1;
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .luxury-line-text {
            font-family: 'Cinzel', serif;
            font-size: 7px;
            letter-spacing: 4px;
            color: var(--dourado-logo);
            text-transform: uppercase;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .luxury-pulse-line {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, var(--dourado-logo) 0%, rgba(197, 160, 89, 0.1) 100%);
            position: relative;
            overflow: hidden;
        }

        .luxury-pulse-line::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: linePulseMotion 4s infinite ease-in-out;
        }

        @keyframes linePulseMotion {
            0% { left: -100%; opacity: 0; }
            20% { opacity: 1; }
            50% { left: 100%; opacity: 0; }
            100% { left: 100%; opacity: 0; }
        }

        .logo-main { 
            width: 110px; 
            position: relative; 
            z-index: 5; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
            transition: transform 0.4s ease;
        }

        .search-area { 
            padding: 0rem 1.5rem 0.8rem; 
            margin-top: -12px; 
            position: relative; 
            z-index: 11; 
            max-width: 100%; 
        }

        .search-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 8px 20px; 
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%; 
            background: transparent; 
            border: none;
            outline: none; 
            text-transform: uppercase; 
            font-size: 11px;
            color: #fff; 
            letter-spacing: 2px; 
            text-align: center; 
            font-weight: 300;
        }

        /* CORREÇÃO DO ALINHAMENTO DO MENU (FIXO) */
        .brand-section-container {
            display: flex;
            align-items: center; /* Alinhamento vertical perfeito */
            gap: 10px; /* Espaço entre menu e botões */
            padding: 0 15px;
            margin-bottom: 1.5rem;
            height: 60px; /* Altura fixa para ancorar o alinhamento */
        }

        .menu-hamburger {
            width: 45px; 
            height: 40px; /* Altura idêntica ao brand-item */
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            border: 1px solid rgba(197, 160, 89, 0.2);
            background: rgba(255,255,255,0.02); 
            border-radius: 4px;
            flex-shrink: 0;
            margin: 0;
        }

        #brandMenu {
            display: flex; 
            overflow-x: auto; 
            gap: 8px; 
            padding-bottom: 12px; /* Espaço para a barra dourada */
            align-items: center;
            flex-grow: 1;
            scrollbar-width: thin;
            scrollbar-color: var(--dourado-logo) transparent;
        }

        /* BARRA DOURADA TOTALMENTE FUNCIONAL */
        #brandMenu::-webkit-scrollbar { 
            display: block; 
            height: 4px; 
        }
        #brandMenu::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        #brandMenu::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, var(--dourado-logo), var(--dourado-brilho));
            border-radius: 10px;
        }
        
        .brand-item {
            font-family: 'Cinzel', serif; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0 20px; 
            font-size: 10px; 
            text-transform: uppercase;
            color: rgba(197, 160, 89, 0.7); 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(8px);
            white-space: nowrap;
            letter-spacing: 1.5px;
            transition: all 0.4s;
            cursor: pointer;
            border-radius: 4px;
            height: 40px; /* Mesma altura do menu hamburguer */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-item.active { 
            background: rgba(197, 160, 89, 0.1); 
            color: #fff; 
            border-color: var(--dourado-logo);
        }

        /* ESTILOS DE PRODUTO MANTIDOS */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; padding: 0 15px; 
        }

        @media (min-width: 1024px) {
            .product-grid { grid-template-columns: repeat(4, 1fr); max-width: 1400px; margin: 0 auto; gap: 30px; }
        }

        .product-card {
            position: relative;
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 15px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 10px 30px rgba(0,10,5,0.8);
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-8px);
            background: rgba(0, 0, 0, 0.35); 
            border-color: rgba(197, 160, 89, 0.4);
        }

        .card-animate { opacity: 0; animation: cardAppear 0.6s ease forwards; }
        @keyframes cardAppear { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .card-note-tag {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 6px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: var(--dourado-logo);
            background: rgba(197, 160, 89, 0.05);
            border-radius: 2px;
            white-space: nowrap;
        }

        .product-img { height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; cursor: pointer; overflow: hidden; }
        .product-img img { max-height: 100%; object-fit: contain; transition: transform 0.6s cubic-bezier(0.33, 1, 0.68, 1); }
        .product-card:hover .product-img img { transform: scale(1.12); }

        .product-brand { font-size: 9px; color: var(--dourado-logo); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 2px; }
        .product-name { font-size: 13px; font-weight: 400; text-transform: uppercase; line-height: 1.3; height: 2.6em; overflow: hidden; margin-bottom: 10px; color: #fff; letter-spacing: 1px; }
        
        .product-price { 
            font-size: 16px; 
            font-weight: 700; 
            margin-bottom: 18px; 
            letter-spacing: 1px; 
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldFoil 3s linear infinite;
        }

        @keyframes goldFoil { to { background-position: 200% center; } }

        .btn-add {
            background: #ffffff; color: #000; width: 100%; padding: 14px 0; border: 1px solid rgba(197, 160, 89, 0.4); 
            font-family: 'Cinzel', serif; font-weight: 700; font-size: 9px; text-transform: uppercase; letter-spacing: 2.5px; cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
        }

        .qty-selector {
            display: flex; align-items: center; justify-content: center; gap: 15px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 5px;
        }

        .qty-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: #fff; color: #000; border-radius: 50%; font-weight: bold; }

        /* NOTIFICAÇÃO (TOAST) CORRIGIDA NO FUNDO */
        #luxuryToast { 
            visibility: hidden; 
            min-width: 300px; 
            background-color: var(--verde-detalhe); 
            color: #fff; 
            text-align: center; 
            border: 1px solid var(--dourado-logo); 
            padding: 16px; 
            position: fixed; 
            z-index: 9999999; /* Máxima prioridade */
            left: 50%; 
            bottom: 40px; /* Posicionado no fundo para não tampar o menu */
            transform: translateX(-50%); 
            font-family: 'Cinzel', serif; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #luxuryToast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 40px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 40px; opacity: 1; } to { bottom: 0; opacity: 0; } }

        /* MANTIDO O RESTANTE */
        #sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: rgba(0, 22, 15, 0.8); backdrop-filter: blur(15px); z-index: 3000; transition: left 0.4s; border-right: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2999; display: none; }
        .cart-float { position: fixed; bottom: 30px; right: 20px; background: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 100; box-shadow: 0 6px 25px rgba(0,0,0,0.7); cursor: pointer; }
        .cart-count { position: absolute; top: 0px; right: 0px; background: #ff0000; color: #fff; font-size: 11px; width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #fff; }

    </style>
</head>
<body>

    <canvas id="magicDustCanvas"></canvas>
    <div class="noise-bg"></div>
    <div id="scrollProgress"></div>
    <div id="luxuryToast"></div>

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>
    <nav id="sidebar">
        <div class="sidebar-header flex justify-between items-center p-6 border-b border-[rgba(255,255,255,0.1)]">
            <span class="font-luxury text-sm text-white tracking-widest">MENU</span>
            <span class="text-2xl cursor-pointer text-white" onclick="toggleSidebar(false)">&times;</span>
        </div>
        <div id="sidebarOriginsList" class="overflow-y-auto"></div>
    </nav>

    <div id="splash-screen">
        <div class="video-vignette"></div>
        <video id="introVideo" autoplay muted playsinline>
            <source src="VideoEntrada.mp4" type="video/mp4">
        </video>
    </div>

    <header class="header-container">
        <img src="assinatura.png" alt="Logo" class="logo-main">
        <div class="luxury-line-container">
            <span class="luxury-line-text">Perfumaria De Luxo</span>
            <div class="luxury-pulse-line"></div>
        </div>
    </header>

    <div class="search-area">
        <div class="search-container">
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="BUSQUE SUA FRAGRÂNCIA..." class="search-input">
        </div>
    </div>

    <!-- SEÇÃO DE MARCAS ALINHADA E SEM AUTO-SCROLL -->
    <div class="brand-section-container">
        <div class="menu-hamburger" onclick="toggleSidebar(true)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c5a059" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </div>
        <div id="brandMenu"></div>
    </div>

    <main class="product-grid" id="productGrid"></main>

    <div id="productModal" onclick="closeModalExterno(event, 'productModal')" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; justify-content:center; align-items:center; padding:20px; backdrop-filter:blur(12px);">
        <div class="modal-container" onclick="event.stopPropagation()" style="background:rgba(0,22,15,0.75); padding:40px 25px; border-radius:8px; width:100%; max-width:450px; position:relative;">
            <span class="close-modal" onclick="closeModal('productModal')" style="position:absolute; top:10px; right:20px; font-size:30px; cursor:pointer; color:#ff0000;">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <div id="cartModal" onclick="closeModalExterno(event, 'cartModal')" style="display:none; position:fixed; top:0; right:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2000; justify-content:flex-end;">
        <div class="modal-container" onclick="event.stopPropagation()" style="background:#fff; color:#000; width:100%; max-width:400px; height:100%; display:flex; flex-direction:column;">
            <h2 class="font-luxury p-6 text-center border-b">CARRINHO</h2>
            <div id="cartSummaryList" class="flex-1 overflow-y-auto p-6"></div>
            <div class="p-6 border-t">
                <div class="flex justify-between font-bold text-xl mb-4"><span>TOTAL:</span><span id="cartSummaryTotal">R$ 0,00</span></div>
                <button class="btn-add bg-black text-white" onclick="finalizeOrder()">FINALIZAR PEDIDO</button>
                <button class="w-full mt-2 text-xs uppercase" onclick="closeModal('cartModal')">Continuar Comprando</button>
            </div>
        </div>
    </div>

    <div class="cart-float" onclick="openCartModal()">
        <svg width="28" height="28" viewBox="0 0 16 16"><path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l.84 4.479 9.144-.459L13.89 4H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>
        <div class="cart-count" id="cartBadge">0</div>
    </div>

    <script>
        const BASE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0crXc21GaE7jllSoyZqiE5xIa7lGGvtKEFjbK-0oil1dQWdMwcz6cRpH70qPbWMwzZF1KlLEP8d83/pub?gid=0&single=true&output=csv'; 
        let database = []; let cart = []; const whatsappNumber = "5595991154395";

        const canvas = document.getElementById('magicDustCanvas'); const ctx = canvas.getContext('2d'); let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y; this.size = Math.random() * 2.5 + 0.5;
                this.speedX = Math.random() * 1.5 - 0.75; this.speedY = Math.random() * 1.5 - 0.75;
                this.color = Math.random() > 0.5 ? '#c5a059' : '#fcf6ba'; this.opacity = 1; this.life = 1; this.decay = Math.random() * 0.015 + 0.01;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.life -= this.decay; this.opacity = this.life; }
            draw() { ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }

        window.addEventListener('mousemove', (e) => { for (let i = 0; i < 3; i++) particles.push(new Particle(e.clientX, e.clientY)); });

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                if (particles[i].life <= 0) { particles.splice(i, 1); i--; }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        async function loadSheetData() {
            try {
                const response = await fetch(BASE_SHEET_URL + '&t=' + new Date().getTime());
                const data = await response.text();
                const allRows = data.split(/\r?\n/).slice(1); 
                database = allRows.map(row => {
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    return {
                        id: columns[0]?.trim(), marca: columns[1]?.trim(), origem: columns[2]?.trim(), nome: columns[3]?.trim(),   
                        preco: parseFloat(columns[4]?.replace(',', '.').trim() || 0),
                        promocao: parseFloat(columns[5]?.replace(',', '.').trim() || 0),
                        imagem: columns[6]?.trim(), descricao: columns[7]?.trim() || "Fragrância exclusiva.",
                        maisVendido: columns[8]?.trim() === "1",
                        notasTopo: columns[9]?.trim() || "", notasCoracao: columns[10]?.trim() || "", notasBase: columns[11]?.trim() || ""
                    };
                }).filter(p => p.nome);
                generateMenus(database); displayProducts(database, true); 
            } catch (e) { console.error(e); }
        }

        function generateMenus(data) {
            const hMenu = document.getElementById('brandMenu');
            const brands = [...new Set(data.map(p => p.marca))].sort();
            let hHtml = `<div class="brand-item active" onclick="filterByBrand('Todos', this)">TODOS</div>`;
            brands.forEach(b => { hHtml += `<div class="brand-item" onclick="filterByBrand('${b}', this)">${b.toUpperCase()}</div>`; });
            hMenu.innerHTML = hHtml;
        }

        function displayProducts(products, shouldAnimate = false) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map((p, index) => {
                const itemInCart = cart.find(i => i.id === p.id);
                const qty = itemInCart ? itemInCart.qty : 0;
                const price = p.promocao > 0 ? `<span>R$ ${p.promocao.toFixed(2).replace('.', ',')}</span>` : `<span>R$ ${p.preco.toFixed(2).replace('.', ',')}</span>`;
                let controls = p.preco > 0 ? (qty > 0 ? `<div class="qty-selector"><button class="qty-btn" onclick="changeQty('${p.id}', -1)">-</button><span class="mx-4">${qty}</span><button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button></div>` : `<button class="btn-add" onclick="addToCart('${p.id}')">COMPRAR</button>`) : `<button class="btn-add opacity-50" disabled>ESGOTADO</button>`;
                return `<div class="product-card ${shouldAnimate ? 'card-animate' : ''}" style="animation-delay:${index*0.05}s">${p.maisVendido ? '<div class="badge-best-seller">★ Top</div>' : ''}<div onclick="openModal('${p.id}')"><img src="${p.imagem}" class="h-40 mx-auto object-contain mb-4"><p class="product-brand">${p.marca}</p><h2 class="product-name font-luxury">${p.nome}</h2></div><p class="product-price">${price}</p>${controls}</div>`;
            }).join('');
        }

        function filterByBrand(brand, element) {
            document.querySelectorAll('.brand-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            displayProducts(brand === 'Todos' ? database : database.filter(p => p.marca === brand), true);
        }

        function addToCart(id) {
            const p = database.find(i => i.id === id);
            cart.push({ ...p, qty: 1 });
            updateBadge(); displayProducts(database, false);
            showLuxuryToast("Boas compras", "item adicionado ao carrinho");
        }

        function changeQty(id, delta) {
            const idx = cart.findIndex(i => i.id === id);
            if (idx > -1) { cart[idx].qty = Math.max(0, cart[idx].qty + delta); if (cart[idx].qty === 0) cart.splice(idx, 1); }
            updateBadge(); displayProducts(database, false);
            if (document.getElementById('cartModal').style.display === 'flex') renderCartSummary();
        }

        function updateBadge() { document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + i.qty, 0); }
        function showLuxuryToast(title, subtext) { const t = document.getElementById("luxuryToast"); t.innerHTML = `<b>${title}</b><br>${subtext}`; t.className = "show"; setTimeout(() => t.className = "", 3000); }
        
        function openCartModal() {
            if (cart.length === 0) return showLuxuryToast("Vazio", "Adicione algo!");
            renderCartSummary();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function renderCartSummary() {
            let total = 0;
            document.getElementById('cartSummaryList').innerHTML = cart.map(i => {
                const p = i.promocao > 0 ? i.promocao : i.preco; total += p * i.qty;
                return `<div class="flex justify-between items-center mb-4 pb-4 border-b"><div><b>${i.nome}</b><br>R$ ${p.toFixed(2)} x ${i.qty}</div><button onclick="changeQty('${i.id}', -i.qty)">❌</button></div>`;
            }).join('');
            document.getElementById('cartSummaryTotal').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function openModal(id) {
            const p = database.find(i => i.id === id);
            document.getElementById('modalContent').innerHTML = `<img src="${p.imagem}" class="h-60 mx-auto object-contain mb-6"><h2 class="text-2xl font-luxury text-center mb-4">${p.nome}</h2><p class="text-gray-400 text-center italic mb-6">"${p.descricao}"</p><button class="btn-add" onclick="addToCart('${p.id}'); closeModal('productModal')">ADICIONAR AO CARRINHO</button>`;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeModalExterno(e, id) { if (e.target.id === id) closeModal(id); }
        function toggleSidebar(open) { document.getElementById('sidebar').classList.toggle('open', open); document.getElementById('sidebarOverlay').style.display = open ? 'block' : 'none'; }
        function filterProducts() { const q = document.getElementById('searchInput').value.toLowerCase(); displayProducts(database.filter(p => p.nome.toLowerCase().includes(q) || p.marca.toLowerCase().includes(q)), true); }
        function finalizeOrder() { 
            let msg = "Olá! Gostaria de:\n" + cart.map(i => `- ${i.qty}x ${i.nome}`).join('\n');
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.addEventListener('load', () => { 
            setTimeout(() => { document.getElementById('splash-screen').style.opacity = '0'; setTimeout(() => document.getElementById('splash-screen').remove(), 800); }, 1500);
            loadSheetData(); 
        });
    </script>
</body>
</html>
