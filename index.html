<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Parfum</title>
    
    <!-- ÍCONE DA ABA DO NAVEGADOR -->
    <link rel="icon" type="image/png" href="assinatura.png">
    
    <!-- FRAMEWORKS E FONTES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --verde-fundo: #00160f; 
            --verde-detalhe: #002419;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde-fundo); 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
        }

        /* BARRA DE PROGRESSO */
        #scrollProgress {
            position: fixed;
            top: 0; left: 0;
            width: 0%; height: 2px;
            background: linear-gradient(90deg, var(--dourado-logo), var(--dourado-brilho));
            z-index: 10001;
            box-shadow: 0 0 8px rgba(197, 160, 89, 0.5);
            transition: width 0.1s ease-out;
        }

        /* 1. REFINAMENTO SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--verde-fundo);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .splash-hidden { opacity: 0; visibility: hidden; }
        .splash-hidden .splash-content { transform: scale(0.85); }

        .mist-effect {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.3) 0%, transparent 70%);
            filter: blur(20px);
            border-radius: 50%;
            animation: mist-breathe 2.5s infinite ease-in-out;
        }

        @keyframes mist-breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.6; }
        }

        /* 2. HEADER FIXO (STICKY) E GLASSMORPHISM */
        .sticky-header-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(0, 22, 15, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.1);
            transition: background 0.3s ease;
        }

        .logo-main { width: 130px; transition: transform 0.3s ease; margin-bottom: -35px; margin-top: -5px;}
        .font-luxury { font-family: 'Cinzel', serif; }

        .search-area { padding: 1rem 1.5rem; }
        .search-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 50px;
            padding: 10px 20px;
            transition: all 0.3s ease;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%; background: transparent; border: none; outline: none; 
            text-transform: uppercase; font-size: 11px; color: #fff; 
            letter-spacing: 2px; text-align: center;
        }

        /* 4. MICRO-INTERAÇÕES NOS CARDS */
        .product-card {
            position: relative;
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(197, 160, 89, 0.08);
            padding: 20px 15px; 
            text-align: center; 
            display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .product-card:hover {
            transform: translateY(-10px);
            background: rgba(255,255,255,0.05);
            border-color: rgba(197, 160, 89, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .product-img { 
            height: 180px; display: flex; align-items: center; justify-content: center; 
            margin-bottom: 15px; cursor: pointer; overflow: hidden;
        }
        
        .product-img img { 
            max-height: 100%; object-fit: contain; 
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .product-card:hover .product-img img { transform: scale(1.1); }

        /* 8. CARRINHO LATERAL (DRAWER) */
        #cartModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 5000; backdrop-filter: blur(5px);
            justify-content: flex-end; /* Alinha o conteúdo à direita */
        }

        #cartModal .modal-container {
            background: #fff; color: #000; width: 100%; max-width: 400px; height: 100%;
            margin: 0; padding: 0; position: relative; display: flex; flex-direction: column;
            animation: drawerSlide 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes drawerSlide {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        /* ELEMENTOS ORIGINAIS DO CARRINHO ADAPTADOS AO DRAWER */
        #cartModal h2 { 
            color: #fff; background-color: var(--verde-fundo); 
            padding: 30px 20px; text-transform: uppercase; font-weight: 700; 
            letter-spacing: 2px; margin: 0; text-align: center;
        }

        #cartSummaryList { flex: 1; overflow-y: auto; padding: 20px; }

        /* SIDEBAR ORIGENS */
        #sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background-color: var(--verde-fundo); z-index: 6000;
            transition: left 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            border-right: 1px solid rgba(197, 160, 89, 0.3);
            display: flex; flex-direction: column;
        }
        #sidebar.open { left: 0; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 5999; display: none; }

        /* BRAND MENU HORIZONTAL */
        #brandMenu { display: flex; overflow-x: auto; gap: 12px; padding: 10px 15px; scrollbar-width: none; align-items: center; }
        #brandMenu::-webkit-scrollbar { display: none; }
        .brand-item {
            font-family: 'Cinzel', serif; border: 1px solid rgba(197, 160, 89, 0.15);
            padding: 8px 20px; font-size: 10px; text-transform: uppercase;
            color: rgba(197, 160, 89, 0.7); background: rgba(255, 255, 255, 0.02); 
            white-space: nowrap; border-radius: 4px; cursor: pointer; transition: 0.3s;
        }
        .brand-item.active { background: rgba(197, 160, 89, 0.1); color: #fff; border-color: var(--dourado-logo); }

        /* BOTÕES E TAGS */
        .badge-best-seller { position: absolute; top: 10px; left: 10px; background: linear-gradient(90deg, #8b6d31, #c5a059); color: white; font-size: 8px; font-weight: 700; padding: 4px 8px; border-radius: 4px; z-index: 20; text-transform: uppercase; }
        .card-note-tag { font-size: 7px; text-transform: uppercase; letter-spacing: 1px; padding: 2px 6px; border: 1px solid rgba(197, 160, 89, 0.3); color: var(--dourado-logo); background: rgba(197, 160, 89, 0.05); border-radius: 2px; }
        .btn-add { background: #ffffff; color: #000; width: 100%; padding: 12px 0; border: 1px solid #ffffff; font-family: 'Cinzel', serif; font-weight: 700; font-size: 10px; text-transform: uppercase; cursor: pointer; position: relative; overflow: hidden; }
        
        .qty-selector { display: flex; align-items: center; justify-content: center; gap: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(197, 160, 89, 0.2); padding: 10px 5px; }
        .qty-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: #fff; color: #000; border-radius: 50%; font-weight: bold; }
        
        /* MODAL PRODUTO DETALHES */
        #productModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 4000; backdrop-filter: blur(8px); justify-content: center; align-items: center; padding: 20px; }
        .modal-container-prod { background: var(--verde-fundo); border: 1px solid var(--dourado-logo); width: 100%; max-width: 450px; padding: 40px 25px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 10px; right: 20px; color: #ff0000; font-size: 40px; cursor: pointer; z-index: 5100; font-weight: bold; }

        /* FLOATING CART */
        .cart-float { position: fixed; bottom: 30px; right: 20px; background: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 1000; box-shadow: 0 6px 25px rgba(0,0,0,0.7); cursor: pointer; }
        .cart-count { position: absolute; top: 0px; right: 0px; background: #ff0000; color: #fff; font-size: 11px; width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #fff; }

        /* TOAST */
        #luxuryToast { visibility: hidden; min-width: 250px; background-color: var(--verde-detalhe); color: #fff; text-align: center; border: 1px solid var(--dourado-logo); padding: 16px; position: fixed; z-index: 7000; left: 50%; bottom: 50px; transform: translateX(-50%); font-family: 'Cinzel', serif; font-size: 10px; }
        #luxuryToast.show { visibility: visible; animation: fadein 0.5s; }
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

        /* GRID */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, 1fr); max-width: 1400px; margin: 0 auto; gap: 30px; } }
    </style>
</head>
<body>

    <div id="scrollProgress"></div>
    <div id="luxuryToast"></div>

    <!-- SIDEBAR ORIGENS (MANTIDO COMPLETO) -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>
    <nav id="sidebar">
        <div class="sidebar-header flex justify-between items-center p-6 border-b border-[rgba(197,160,89,0.2)]">
            <span class="font-luxury text-sm text-white tracking-widest">CATEGORIAS</span>
            <span class="text-2xl cursor-pointer text-white" onclick="toggleSidebar(false)">&times;</span>
        </div>
        <div id="sidebarOriginsList" class="overflow-y-auto"></div>
    </nav>

    <!-- 1. SPLASH SCREEN ATUALIZADA -->
    <div id="splash-screen">
        <div class="mist-effect"></div>
        <div class="splash-content">
            <img src="assinatura.png" alt="Logo" class="w-[250px] mb-4">
            <h1 class="font-luxury text-[10px] tracking-[0.6em] text-[#c5a059] welcome-text">CARREGANDO FRAGRÂNCIAS</h1>
        </div>
    </div>

    <!-- 2. HEADER FIXO GLASSMORPHISM -->
    <div class="sticky-header-container">
        <header class="flex flex-col items-center pt-4">
            <img src="assinatura.png" alt="Logo" class="logo-main">
        </header>

        <div class="search-area">
            <div class="search-container">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="BUSQUE SUA FRAGRÂNCIA..." class="search-input">
            </div>
        </div>
    </div>

    <!-- MENU DE MARCAS E HAMBURGUER -->
    <div class="flex items-center my-4">
        <div class="ml-4 min-w-[45px] h-[38px] flex items-center justify-center cursor-pointer border border-[rgba(197,160,89,0.2)] bg-[rgba(255,255,255,0.02)] rounded" onclick="toggleSidebar(true)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c5a059" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </div>
        <div id="brandMenu" class="flex-1"></div>
    </div>

    <main class="product-grid" id="productGrid"></main>

    <!-- MODAL PRODUTO (DETALHES) -->
    <div id="productModal" onclick="closeModalExterno(event, 'productModal')">
        <div class="modal-container-prod" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModal('productModal')">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- 8. CARRINHO DRAWER LATERAL -->
    <div id="cartModal" onclick="closeModalExterno(event, 'cartModal')">
        <div class="modal-container" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModal('cartModal')" style="top: 25px; right: 15px;">&times;</span>
            <h2 class="font-luxury">RESUMO DO PEDIDO</h2>
            
            <div id="cartSummaryList"></div>
            
            <div class="p-6 border-t border-gray-100 bg-gray-50">
                <div class="flex justify-between items-center mb-6 font-bold">
                    <span class="text-xs tracking-widest text-gray-500 uppercase">TOTAL:</span>
                    <span id="cartSummaryTotal" class="text-xl">R$ 0,00</span>
                </div>
                
                <div class="mb-6">
                    <p class="text-[10px] tracking-widest mb-3 uppercase font-bold">Opção de Recebimento:</p>
                    <div class="flex flex-col gap-2">
                        <label class="flex items-center gap-2 text-xs cursor-pointer">
                            <input type="radio" name="deliveryMethod" value="Retirar na Loja" checked onclick="toggleDeliveryWarning(false)"> RETIRAR NA LOJA
                        </label>
                        <label class="flex items-center gap-2 text-xs cursor-pointer">
                            <input type="radio" name="deliveryMethod" value="Entrega no Endereço" onclick="toggleDeliveryWarning(true)"> ENTREGAR NO ENDEREÇO
                        </label>
                    </div>
                    <div id="feeWarning" class="text-[10px] text-red-500 mt-2 italic hidden">⚠️ Taxa de entrega a consultar.</div>
                </div>

                <button class="btn-add bg-black text-white py-4" onclick="finalizeOrder()">FINALIZAR NO WHATSAPP</button>
                <div class="flex justify-center mt-4">
                    <img src="pagamento.webp" alt="Pagamento" class="max-w-[70%] opacity-80">
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-12 border-t border-[rgba(197,160,89,0.1)]">
        <div class="text-[10px] text-gray-500 uppercase tracking-widest">© 2024 Assinatura Parfum • Boa Vista - RR</div>
    </footer>

    <div class="cart-float" onclick="openCartModal()">
        <svg width="24" height="24" viewBox="0 0 16 16"><path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5z"/></svg>
        <div class="cart-count" id="cartBadge">0</div>
    </div>

    <script>
        const BASE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0crXc21GaE7jllSoyZqiE5xIa7lGGvtKEFjbK-0oil1dQWdMwcz6cRpH70qPbWMwzZF1KlLEP8d83/pub?gid=0&single=true&output=csv'; 
        
        let database = [];
        let cart = [];
        let isMaintenance = false;
        const whatsappNumber = "5595991154395";

        // SCROLL PROGRESS
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById("scrollProgress").style.width = (winScroll / height) * 100 + "%";
        };

        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (open) { sidebar.classList.add('open'); overlay.style.display = 'block'; } 
            else { sidebar.classList.remove('open'); overlay.style.display = 'none'; }
        }

        function toggleSubmenu(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('hidden');
        }

        async function loadSheetData() {
            try {
                const response = await fetch(BASE_SHEET_URL + '&t=' + new Date().getTime());
                const data = await response.text();
                const allRows = data.split(/\r?\n/);
                const headers = allRows[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                // MODO MANUTENÇÃO
                if (headers[12]?.replace(/"/g, '').trim() === "0") {
                    isMaintenance = true;
                    document.querySelector('.welcome-text').innerText = "SITE EM MANUTENÇÃO";
                    return; 
                }

                const rows = allRows.slice(1); 
                database = rows.map(row => {
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    return {
                        id: columns[0]?.replace(/"/g, '').trim(),
                        marca: columns[1]?.replace(/"/g, '').trim(),
                        origem: columns[2]?.replace(/"/g, '').trim(), 
                        nome: columns[3]?.replace(/"/g, '').trim(),   
                        preco: parseFloat(columns[4]?.replace(/"/g, '').replace(',', '.').trim() || 0),
                        promocao: parseFloat(columns[5]?.replace(/"/g, '').replace(',', '.').trim() || 0),
                        imagem: columns[6]?.replace(/"/g, '').trim(),
                        descricao: columns[7]?.replace(/"/g, '').trim() || "Fragrância exclusiva.",
                        maisVendido: columns[8]?.trim() === "1",
                        notasTopo: columns[9]?.replace(/"/g, '').trim() || "",
                        notasCoracao: columns[10]?.replace(/"/g, '').trim() || "",
                        notasBase: columns[11]?.replace(/"/g, '').trim() || ""
                    };
                }).filter(p => p.nome && p.nome.length > 2);

                generateMenus(database);
                displayProducts(database);

                // REFINAMENTO SPLASH: REMOVE APÓS CARREGAR
                const splash = document.getElementById('splash-screen');
                splash.classList.add('splash-hidden');
                setTimeout(() => splash.remove(), 800);

            } catch (e) { console.error("Erro ao carregar:", e); }
        }

        function generateMenus(data) {
            const horizontalMenu = document.getElementById('brandMenu');
            const sidebarOriginsList = document.getElementById('sidebarOriginsList');
            
            // Marcas Horizontal
            const brands = [...new Set(data.map(p => p.marca))].sort();
            let hHtml = `<div class="brand-item active" onclick="filterByBrand('Todos', this)">TODOS</div>`;
            brands.forEach(b => { hHtml += `<div class="brand-item" onclick="filterByBrand('${b}', this)">${b.toUpperCase()}</div>`; });
            horizontalMenu.innerHTML = hHtml;

            // Origens Sidebar
            const origins = [...new Set(data.map(p => p.origem).filter(o => o))].sort();
            let oHtml = "";
            origins.forEach((origin, index) => {
                const brandsInOrigin = [...new Set(data.filter(p => p.origem === origin).map(p => p.marca))].sort();
                const subId = `submenu_${index}`;
                oHtml += `
                    <div class="p-6 text-white font-luxury text-[11px] tracking-widest cursor-pointer border-b border-[rgba(197,160,89,0.05)] flex justify-between items-center" onclick="toggleSubmenu('${subId}')">
                        ${origin.toUpperCase()}
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                    <div id="${subId}" class="hidden bg-[rgba(0,0,0,0.2)]">
                        <div class="p-4 pl-10 text-[10px] text-gray-400 uppercase cursor-pointer" onclick="filterByOrigin('${origin}')">VER TODOS</div>
                        ${brandsInOrigin.map(brand => `<div class="p-4 pl-10 text-[10px] text-gray-400 uppercase cursor-pointer" onclick="filterByBrand('${brand}')">${brand}</div>`).join('')}
                    </div>`;
            });
            sidebarOriginsList.innerHTML = oHtml;
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map((p) => {
                const itemInCart = cart.find(i => i.id === p.id);
                const precoDisplay = p.promocao > 0 
                    ? `<span class="line-through opacity-50 text-[11px]">R$ ${p.preco.toFixed(2)}</span> <span class="text-[#ff4d4d]">R$ ${p.promocao.toFixed(2)}</span>` 
                    : `R$ ${p.preco.toFixed(2)}`;
                
                const tags = p.notasTopo ? p.notasTopo.split(',').slice(0, 2).map(t => `<span class="card-note-tag">${t.trim()}</span>`).join('') : '';

                return `
                <div class="product-card">
                    ${p.maisVendido ? '<div class="badge-best-seller">★ BEST SELLER</div>' : ''}
                    <div onclick="openModal('${p.id}')">
                        <div class="product-img"><img src="${p.imagem}" onerror="this.src='assinatura.png'"></div>
                        <p class="text-[9px] text-[#c5a059] tracking-widest mb-1 uppercase">${p.marca}</p>
                        <h2 class="product-name font-luxury text-[11px] h-8 overflow-hidden mb-2">${p.nome}</h2>
                        <div class="flex justify-center gap-1 mb-3 h-4">${tags}</div>
                    </div>
                    <div>
                        <p class="text-sm font-light mb-4">${precoDisplay}</p>
                        ${p.preco > 0 ? (itemInCart ? 
                            `<div class="qty-selector"><button class="qty-btn" onclick="changeQty('${p.id}', -1)">-</button><span>${itemInCart.qty}</span><button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button></div>` : 
                            `<button class="btn-add" onclick="addToCart('${p.id}')">ADICIONAR</button>`) : 
                            `<button class="btn-add opacity-50" disabled>ESGOTADO</button>`}
                    </div>
                </div>`;
            }).join('');
        }

        function filterByBrand(brand, el) {
            if(el) {
                document.querySelectorAll('.brand-item').forEach(i => i.classList.remove('active'));
                el.classList.add('active');
            }
            toggleSidebar(false);
            displayProducts(brand === 'Todos' ? database : database.filter(p => p.marca === brand));
        }

        function filterByOrigin(origin) {
            toggleSidebar(false);
            displayProducts(database.filter(p => p.origem === origin));
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            displayProducts(database.filter(p => p.nome.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term)));
        }

        function addToCart(id) {
            const p = database.find(i => i.id === id);
            cart.push({...p, qty: 1});
            updateUI();
            showLuxuryToast("ADICIONADO", p.nome);
        }

        function changeQty(id, delta) {
            const idx = cart.findIndex(i => i.id === id);
            if(idx > -1) {
                cart[idx].qty += delta;
                if(cart[idx].qty <= 0) cart.splice(idx, 1);
            }
            updateUI();
        }

        function updateUI() {
            displayProducts(database);
            document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + i.qty, 0);
            if(document.getElementById('cartModal').style.display === 'flex') renderCart();
        }

        function openCartModal() {
            if(cart.length === 0) return showLuxuryToast("CARRINHO VAZIO", "Escolha um perfume");
            renderCart();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function renderCart() {
            let total = 0;
            const list = document.getElementById('cartSummaryList');
            list.innerHTML = cart.map(i => {
                const preco = i.promocao > 0 ? i.promocao : i.preco;
                const sub = preco * i.qty;
                total += sub;
                return `
                <div class="flex gap-4 py-6 border-b relative">
                    <img src="${i.imagem}" class="w-16 h-16 object-contain">
                    <div class="flex-1">
                        <p class="text-[10px] font-bold uppercase mb-1 pr-6">${i.nome}</p>
                        <p class="text-xs mb-3 text-gray-500">R$ ${preco.toFixed(2)}</p>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center gap-3 bg-gray-100 rounded-full px-3 py-1">
                                <button onclick="changeQty('${i.id}', -1)">-</button>
                                <span class="text-xs font-bold">${i.qty}</span>
                                <button onclick="changeQty('${i.id}', 1)">+</button>
                            </div>
                        </div>
                    </div>
                    <span class="absolute top-6 right-0 text-red-500 font-bold cursor-pointer" onclick="changeQty('${i.id}', -${i.qty})">&times;</span>
                </div>`;
            }).join('');
            document.getElementById('cartSummaryTotal').innerText = `R$ ${total.toFixed(2).replace('.',',')}`;
        }

        function openModal(id) {
            const p = database.find(i => i.id === id);
            const itemInCart = cart.find(c => c.id === p.id);
            const qty = itemInCart ? itemInCart.qty : 0;
            const preco = p.promocao > 0 ? p.promocao : p.preco;

            let pyramid = "";
            if(p.notasTopo || p.notasCoracao || p.notasBase) {
                pyramid = `
                <div class="mt-8 pt-6 border-t border-[rgba(197,160,89,0.1)]">
                    <p class="font-luxury text-[#c5a059] text-[10px] tracking-widest text-center mb-4">PIRÂMIDE OLFATIVA</p>
                    ${p.notasTopo ? `<div class="mb-3 text-[10px]"><span class="text-gray-500 uppercase block">Topo:</span> ${p.notasTopo}</div>` : ''}
                    ${p.notasCoracao ? `<div class="mb-3 text-[10px]"><span class="text-gray-500 uppercase block">Coração:</span> ${p.notasCoracao}</div>` : ''}
                    ${p.notasBase ? `<div class="mb-3 text-[10px]"><span class="text-gray-500 uppercase block">Base:</span> ${p.notasBase}</div>` : ''}
                </div>`;
            }

            document.getElementById('modalContent').innerHTML = `
                <div class="flex justify-center mb-6"><img src="${p.imagem}" class="h-60 object-contain"></div>
                <p class="text-[#c5a059] text-center text-[10px] tracking-widest uppercase mb-1">${p.marca}</p>
                <h2 class="font-luxury text-xl text-center text-white mb-4">${p.nome}</h2>
                <p class="text-xs italic text-gray-400 text-center mb-6 px-4">"${p.descricao}"</p>
                <p class="text-center text-white font-bold text-lg mb-6">R$ ${preco.toFixed(2)}</p>
                ${p.preco > 0 ? (qty > 0 ? 
                    `<div class="qty-selector w-max mx-auto mb-4"><button class="qty-btn" onclick="changeQty('${p.id}', -1); openModal('${p.id}')">-</button><span class="mx-4">${qty}</span><button class="qty-btn" onclick="changeQty('${p.id}', 1); openModal('${p.id}')">+</button></div>` : 
                    `<button class="btn-add" onclick="addToCart('${p.id}'); openModal('${p.id}')">ADICIONAR AO CARRINHO</button>`) : 
                    `<button class="btn-add opacity-50" disabled>ESGOTADO</button>`}
                ${pyramid}
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeModalExterno(e, id) { if(e.target.id === id) closeModal(id); }
        function toggleDeliveryWarning(show) { document.getElementById('feeWarning').classList.toggle('hidden', !show); }

        function finalizeOrder() {
            if(cart.length === 0) return;
            const method = document.querySelector('input[name="deliveryMethod"]:checked').value;
            let msg = `Olá! Gostaria de fazer um pedido:\n\n` + cart.map(i => `• *${i.qty}x ${i.nome}*`).join('\n');
            msg += `\n\n*Total: ${document.getElementById('cartSummaryTotal').innerText}*\n*Opção:* ${method}`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`);
        }

        function showLuxuryToast(title, sub) {
            const t = document.getElementById("luxuryToast");
            t.innerHTML = `<span class="text-[#c5a059]">${title}</span><br>${sub}`;
            t.className = "show";
            setTimeout(() => t.className = "", 3000);
        }

        window.onload = loadSheetData;
    </script>
</body>
</html>
