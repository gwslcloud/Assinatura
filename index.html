<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Parfum</title>
    <link rel="icon" type="image/png" href="assinatura.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-fundo: #00160f; 
            --verde-detalhe: #002419;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde-fundo); 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        
        /* TELA DE BOAS-VINDAS (SPLASH SCREEN) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--verde-fundo);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .splash-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .mist-effect {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.4) 0%, transparent 70%);
            filter: blur(15px);
            border-radius: 50%;
            z-index: 1;
            animation: mist-breathe 2.5s infinite ease-in-out;
        }
        @keyframes mist-breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.7; }
        }
        .welcome-text {
            color: var(--dourado-logo);
            letter-spacing: 0.6em;
            font-size: 11px;
            font-weight: 400;
            z-index: 11;
            margin-top: -135px; 
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.4);
        }

        /* --- ESTILO DA PÁGINA PRINCIPAL --- */
        .golden-line-bg {
            position: absolute;
            top: 85px; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(197, 160, 89, 0.1) 15%, rgba(197, 160, 89, 0.8) 50%, rgba(197, 160, 89, 0.1) 85%, transparent 100%);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
            z-index: 1;
        }
        .header-container {
            position: relative;
            padding: 0.5rem 1rem 0 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .logo-main { width: 150px; position: relative; z-index: 5; margin-bottom: -55px; margin-top: -10px; }
        
        .search-area { padding: 0 1.5rem 0.5rem 1.5rem; position: relative; z-index: 11; }
        .search-input {
            width: 100%; background: transparent; border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding: 4px 0; outline: none; text-transform: uppercase; font-size: 12px;
            color: #fff; letter-spacing: 2px; text-align: center; font-weight: 300;
        }

        #brandMenu {
            display: flex; 
            overflow-x: auto; 
            gap: 10px; 
            padding: 1rem 15px 1.5rem 15px;
            scrollbar-width: none; 
            justify-content: flex-start;
        }
        #brandMenu::-webkit-scrollbar { display: none; }
        
        .brand-item {
            font-family: 'Cinzel', serif; 
            border: 1px solid rgba(197, 160, 89, 0.5);
            padding: 6px 15px; 
            font-size: 10px; 
            text-transform: uppercase;
            color: var(--dourado-logo); 
            background: rgba(0, 0, 0, 0.2); 
            white-space: nowrap;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .brand-item.active {
            background: var(--dourado-logo);
            color: #000;
        }

        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            padding: 0 15px; 
        }

        @media (min-width: 1024px) {
            #brandMenu { justify-content: center; }
            .brand-item { font-size: 13px; padding: 10px 25px; }
            .product-grid { 
                grid-template-columns: repeat(5, 1fr); 
                max-width: 1400px;
                margin: 0 auto;
            }
        }

        .product-card {
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(197, 160, 89, 0.1);
            padding: 15px 10px; text-align: center; display: flex; flex-direction: column; justify-content: space-between;
        }

        .product-img { height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; cursor: pointer; }
        .product-img img { max-height: 100%; object-fit: contain; }
        .product-brand { font-size: 9px; color: var(--dourado-logo); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }
        .product-name { font-size: 12px; font-weight: 500; text-transform: uppercase; line-height: 1.2; height: 2.4em; overflow: hidden; margin-bottom: 8px; color: #fff; cursor: pointer; }
        .product-price { font-size: 14px; font-weight: 400; color: #fff; margin-bottom: 12px; }

        .qty-selector {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            background: rgba(255,255,255,0.08); border-radius: 4px; padding: 6px; margin-bottom: 12px;
        }
        .qty-btn {
            width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
            background: #fff; color: #000; border-radius: 50%; font-weight: bold; cursor: pointer;
        }
        .qty-value { font-size: 15px; font-weight: 600; width: 22px; }

        .btn-add {
            background: #fff; color: #000; width: 100%; padding: 12px 0; 
            font-weight: 700; font-size: 11px; text-transform: uppercase; cursor: pointer;
        }

        /* --- ESTILO DO MODAL DE DETALHES --- */
        #productModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-container {
            background: var(--verde-fundo);
            border: 1px solid var(--dourado-logo);
            width: 100%;
            max-width: 450px;
            padding: 40px 25px;
            position: relative;
            animation: modalFadeUp 0.4s ease-out;
        }
        @keyframes modalFadeUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            color: var(--dourado-logo);
            font-size: 30px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-desc-text {
            font-size: 14px;
            color: #bbb;
            line-height: 1.6;
            margin: 20px 0;
            text-align: center;
            font-weight: 300;
        }

        .cart-float {
            position: fixed; bottom: 30px; right: 20px; background: #fff;
            width: 60px; height: 60px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; z-index: 100;
            box-shadow: 0 6px 25px rgba(0,0,0,0.7); cursor: pointer;
        }
        .cart-float svg { fill: #000; } 
        .cart-count {
            position: absolute; top: 0px; right: 0px; background: #ff0000;
            color: #fff; font-size: 11px; width: 22px; height: 22px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: bold; border: 2px solid #fff;
        }

        /* --- ESTILO DO RODAPÉ (FOOTER) PROFISSIONAL --- */
        footer { 
            text-align: center; 
            padding: 60px 20px; 
            margin-top: 60px; 
            border-top: 1px solid rgba(197, 160, 89, 0.15); 
            background: rgba(0, 0, 0, 0.2);
        }
        .footer-title { color: var(--dourado-logo); font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; margin-bottom: 12px; font-family: 'Cinzel'; font-weight: 700; }
        .footer-subtitle { color: #5a7a6f; font-size: 10px; letter-spacing: 0.6em; text-transform: uppercase; margin-bottom: 40px; font-weight: 300; }
        
        .social-section { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        .social-label { 
            font-family: 'Cinzel', serif; 
            color: var(--dourado-logo); 
            font-size: 10px; 
            letter-spacing: 0.3em; 
            margin-bottom: 25px; 
            opacity: 0.9;
        }
        .social-icons-wrapper { display: flex; gap: 30px; justify-content: center; align-items: center; }
        .social-link { 
            color: var(--dourado-logo); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .social-link:hover { 
            transform: translateY(-5px) scale(1.1); 
            color: var(--dourado-brilho); 
            filter: drop-shadow(0 0 10px rgba(197, 160, 89, 0.6));
        }
        .social-link svg { width: 24px; height: 24px; fill: currentColor; }

    </style>
</head>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0crXc21GaE7jllSoyZqiE5xIa7lGGvtKEFjbK-0oil1dQWdMwcz6cRpH70qPbWMwzZF1KlLEP8d83/pub?gid=0&single=true&output=csv'; 

        let database = [];
        let cart = [];
        const whatsappNumber = "5595991154395";

        function parseCSVLine(line) {
            const result = [];
            let cur = '';
            let inQuote = false;
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    inQuote = !inQuote;
                } else if (char === ',' && !inQuote) {
                    result.push(cur);
                    cur = '';
                } else {
                    cur += char;
                }
            }
            result.push(cur);
            return result;
        }

        async function loadSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1); 
                
                database = rows.map(row => {
                    const columns = parseCSVLine(row);
                    return {
                        id: columns[0]?.trim(),
                        marca: columns[1]?.trim(),
                        nome: columns[2]?.trim(),
                        preco: parseFloat(columns[3]?.replace(',', '.').trim() || 0),
                        imagem: columns[4]?.trim(),
                        descricao: columns[5]?.trim() || "Fragrância exclusiva da Assinatura Parfum."
                    };
                }).filter(p => p.nome && p.nome.length > 2 && p.preco > 0); 

                generateBrandMenu(database);
                displayProducts(database);
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        function generateBrandMenu(data) {
            const menu = document.getElementById('brandMenu');
            const brands = [...new Set(data.map(p => p.marca.trim()))].sort();
            let menuHTML = `<div class="brand-item active" onclick="filterByBrand('Todos', this)">TODOS</div>`;
            brands.forEach(brand => {
                if(brand) {
                    menuHTML += `<div class="brand-item" onclick="filterByBrand('${brand}', this)">${brand.toUpperCase()}</div>`;
                }
            });
            menu.innerHTML = menuHTML;
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => {
                const cartItem = cart.find(item => item.id === p.id);
                const currentQty = cartItem ? cartItem.qty : 0;

                return `
                <div class="product-card">
                    <div>
                        <div class="product-img" onclick="openModal('${p.id}')">
                            <img src="${p.imagem}" alt="${p.nome}" onerror="this.src='assinatura.png'">
                        </div>
                        <p class="product-brand">${p.marca}</p>
                        <h2 class="product-name font-luxury" onclick="openModal('${p.id}')">${p.nome}</h2>
                    </div>
                    <div>
                        <p class="product-price">R$ ${p.preco.toFixed(2).replace('.', ',')}</p>
                        <div class="qty-selector">
                            <button class="qty-btn" onclick="changeQty('${p.id}', -1)">-</button>
                            <span class="qty-value" id="qty-${p.id}">${currentQty}</span>
                            <button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button>
                        </div>
                        <button class="btn-add" onclick="addToCart('${p.id}')">ADICIONAR</button>
                    </div>
                </div>
            `}).join('');
        }

        function openModal(id) {
            const p = database.find(item => item.id === id);
            const modal = document.getElementById('productModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div class="flex justify-center mb-6">
                    <img src="${p.imagem}" class="h-56 object-contain" onerror="this.src='assinatura.png'">
                </div>
                <p class="product-brand text-center">${p.marca}</p>
                <h2 class="font-luxury text-2xl text-center text-white mb-3">${p.nome}</h2>
                <div class="w-12 h-[1px] bg-gold mx-auto mb-6" style="background:var(--dourado-logo)"></div>
                <p class="modal-desc-text italic">"${p.descricao}"</p>
                <p class="text-center text-white font-semibold text-xl mb-6">R$ ${p.preco.toFixed(2).replace('.', ',')}</p>
                <button class="btn-add" onclick="closeModal(); addToCart('${p.id}')">ADICIONAR AO PEDIDO</button>
            `;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function closeModalExterno(e) {
            if (e.target.id === 'productModal') closeModal();
        }

        function filterByBrand(brand, element) {
            document.querySelectorAll('.brand-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            const filtered = (brand === 'Todos') ? database : database.filter(p => p.marca.trim() === brand);
            displayProducts(filtered);
        }

        function changeQty(id, delta) {
            const el = document.getElementById(`qty-${id}`);
            if(!el) return;
            let val = parseInt(el.innerText);
            val = Math.max(0, val + delta); 
            el.innerText = val;

            const cartIndex = cart.findIndex(item => item.id === id);
            if (cartIndex > -1) {
                if (val === 0) { cart.splice(cartIndex, 1); } 
                else { cart[cartIndex].qty = val; }
                updateBadge();
            }
        }

        function addToCart(id) {
            const product = database.find(p => p.id === id);
            const qtyElement = document.getElementById(`qty-${id}`);
            let qty = qtyElement ? parseInt(qtyElement.innerText) : 1;
            if(qty === 0) qty = 1; 

            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty = qty; } 
            else { cart.push({ ...product, qty: qty }); }
            if(qtyElement) qtyElement.innerText = qty;
            updateBadge();
            alert("Produto adicionado com sucesso!");
        }

        function updateBadge() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartBadge').innerText = totalItems;
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }
            let message = "Olá! Gostaria de fazer um pedido:\n\n";
            let totalOrder = 0;
            cart.forEach(item => {
                let subtotal = item.preco * item.qty;
                message += `*${item.qty}x ${item.nome}*\n`;
                message += `Unid: R$ ${item.preco.toFixed(2)} | Sub: R$ ${subtotal.toFixed(2)}\n\n`;
                totalOrder += subtotal;
            });
            message += `*TOTAL DO PEDIDO: R$ ${totalOrder.toFixed(2)}*`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = database.filter(p => p.nome.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term));
            displayProducts(filtered);
        }

        window.addEventListener('load', () => {
            loadSheetData();
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.transition = 'opacity 0.8s ease';
                splash.style.opacity = '0'; 
                setTimeout(() => { splash.remove(); }, 800);
            }, 2500); 
        });
    </script>
</body>
</html>
