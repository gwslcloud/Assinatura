<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura Perfume | Catálogo Exclusivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-deep: #001a12;
            --dourado: #c5a059;
            --dourado-claro: #e2c275;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #fcfcfc; 
            color: #333;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        .bg-verde { background-color: var(--verde-deep); }
        .text-gold { color: var(--dourado); }
        .border-gold { border-color: var(--dourado); }
        
        /* Efeito de brilho no dourado */
        .btn-gold {
            background: linear-gradient(135deg, var(--dourado), var(--dourado-claro));
            color: var(--verde-deep);
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4);
        }
        
        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            border-color: var(--dourado);
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <!-- Header Luxo com Logo Centralizada -->
    <header class="bg-verde pt-8 pb-6 shadow-2xl">
        <div class="container mx-auto px-4 flex flex-col items-center">
            <!-- A LOGO FICA AQUI -->
            <img src="assinatura.jpg" alt="Assinatura Perfume" class="w-48 md:w-64 mb-6 transition-all duration-500 hover:scale-105">
            
            <nav class="w-full max-w-2xl border-t border-white/10 pt-6 flex justify-center space-x-8 text-xs md:text-sm uppercase tracking-[0.2em] text-gray-300 font-medium">
                <a href="#" class="hover:text-gold transition">Início</a>
                <a href="#" class="hover:text-gold transition">Árabes</a>
                <a href="#" class="hover:text-gold transition">Franch</a>
                <a href="#" class="hover:text-gold transition">Nicho</a>
            </nav>
        </div>
    </header>

    <!-- Barra de Pesquisa Elegante -->
    <div class="bg-white border-b sticky top-0 z-50 py-4 shadow-sm">
        <div class="container mx-auto px-4">
            <div class="max-w-xl mx-auto relative">
                <input type="text" id="search" placeholder="Busque sua fragrância de assinatura..." 
                class="w-full bg-gray-50 border border-gray-200 rounded-none py-3 px-10 focus:outline-none focus:border-gold transition-all text-sm">
                <span class="absolute left-3 top-3.5 opacity-30">🔍</span>
            </div>
        </div>
    </div>

    <main class="container mx-auto px-4 py-12 flex flex-col md:flex-row gap-12">
        
        <!-- Sidebar lateral (estilo Atlântico) -->
        <aside class="w-full md:w-1/4">
            <h2 class="font-luxury text-lg border-b-2 border-gold pb-3 mb-6 tracking-widest uppercase">Categorias</h2>
            <ul class="space-y-4 text-sm font-medium text-gray-600">
                <li class="hover:text-gold cursor-pointer flex justify-between items-center transition">Afnan <span>→</span></li>
                <li class="text-gold cursor-pointer flex justify-between items-center font-bold">Khadlaj <span>→</span></li>
                <li class="hover:text-gold cursor-pointer flex justify-between items-center transition">Lattafa <span>→</span></li>
                <li class="hover:text-gold cursor-pointer flex justify-between items-center transition">Maison Alhambra <span>→</span></li>
                <li class="hover:text-gold cursor-pointer flex justify-between items-center transition">Armaf <span>→</span></li>
            </ul>
        </aside>

        <!-- Grade de Perfumes Dinâmica -->
        <section class="w-full md:w-3/4">
            <div id="catalog" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Os perfumes serão carregados aqui via JavaScript -->
            </div>
        </section>
    </main>

    <footer class="bg-verde text-white py-12 mt-20 border-t-4 border-gold">
        <div class="container mx-auto px-4 text-center">
            <p class="font-luxury text-gold tracking-widest mb-4">Assinatura Perfume</p>
            <p class="text-xs text-gray-500 uppercase tracking-widest">A sofisticação em cada nota.</p>
        </div>
    </footer>

    <!-- LOGICA PARA ADICIONAR PERFUMES FACILMENTE -->
    <script>
        // COMO ADICIONAR FOTOS E PERFUMES: 
        // Basta adicionar um novo item entre as chaves { } abaixo.
        const perfumes = [
            {
                marca: "Khadlaj",
                nome: "Oud Al Sabah",
                preco: "99,00",
                de: "129,00",
                imagem: "https://via.placeholder.com/400x500/f3f3f3/999?text=Oud+Al+Sabah", // Troque pelo link da foto
                linkWhats: "https://wa.me/SEUNUMERO"
            },
            {
                marca: "Khadlaj",
                nome: "Strawberry Shake",
                preco: "189,00",
                de: "",
                imagem: "https://via.placeholder.com/400x500/f3f3f3/999?text=Strawberry+Shake",
                linkWhats: "https://wa.me/SEUNUMERO"
            },
            {
                marca: "Khadlaj",
                nome: "Island Vanilla",
                preco: "239,00",
                de: "280,00",
                imagem: "https://via.placeholder.com/400x500/f3f3f3/999?text=Island+Vanilla",
                linkWhats: "https://wa.me/SEUNUMERO"
            }
        ];

        const catalog = document.getElementById('catalog');

        function renderProducts() {
            catalog.innerHTML = perfumes.map(p => `
                <div class="product-card bg-white border border-gray-100 p-4 flex flex-col h-full shadow-sm">
                    <div class="relative overflow-hidden mb-4 group">
                        <img src="${p.imagem}" alt="${p.nome}" class="w-full h-72 object-contain mix-blend-multiply group-hover:scale-110 transition duration-500">
                        ${p.de ? '<span class="absolute top-2 left-2 bg-verde text-gold text-[10px] font-bold px-3 py-1 uppercase tracking-tighter">Oferta</span>' : ''}
                    </div>
                    
                    <div class="flex-grow">
                        <span class="text-[10px] text-gold font-bold uppercase tracking-[0.2em] mb-1 block">${p.marca}</span>
                        <h3 class="font-luxury text-md text-verde-deep mb-3 h-12 overflow-hidden">${p.nome}</h3>
                        
                        <div class="flex items-baseline gap-2 mb-6">
                            ${p.de ? `<span class="text-gray-400 line-through text-xs italic">R$ ${p.de}</span>` : ''}
                            <span class="text-xl font-bold text-verde-deep tracking-tighter">R$ ${p.preco}</span>
                        </div>
                    </div>

                    <a href="${p.linkWhats}" target="_blank" class="btn-gold w-full py-3 text-center text-xs tracking-widest uppercase flex items-center justify-center gap-2">
                        <span>Pedir no WhatsApp</span>
                    </a>
                </div>
            `).join('');
        }

        renderProducts();
    </script>
</body>
</html>
