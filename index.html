<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Parfum</title>
    <link rel="icon" type="image/png" href="assinatura.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-fundo: #00160f; 
            --verde-detalhe: #002419;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde-fundo); 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        
        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--verde-fundo);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .splash-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .mist-effect {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.4) 0%, transparent 70%);
            filter: blur(15px);
            border-radius: 50%;
            z-index: 1;
            animation: mist-breathe 2.5s infinite ease-in-out;
        }
        @keyframes mist-breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.7; }
        }
        .welcome-text {
            color: var(--dourado-logo);
            letter-spacing: 0.6em;
            font-size: 11px;
            font-weight: 400;
            z-index: 11;
            margin-top: -135px; 
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.4);
        }

        /* CABEÇALHO */
        .golden-line-bg {
            position: absolute;
            top: 85px; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(197, 160, 89, 0.1) 15%, rgba(197, 160, 89, 0.8) 50%, rgba(197, 160, 89, 0.1) 85%, transparent 100%);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
            z-index: 1;
        }
        .header-container {
            position: relative;
            padding: 0.5rem 1rem 0 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .logo-main { width: 150px; position: relative; z-index: 5; margin-bottom: -55px; margin-top: -10px; }
        
        .search-area { padding: 0 1.5rem 0.5rem 1.5rem; position: relative; z-index: 11; }
        .search-input {
            width: 100%; background: transparent; border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding: 4px 0; outline: none; text-transform: uppercase; font-size: 12px;
            color: #fff; letter-spacing: 2px; text-align: center; font-weight: 300;
        }

        #brandMenu {
            display: flex; 
            overflow-x: auto; 
            gap: 10px; 
            padding: 1rem 15px 1.5rem 15px;
            scrollbar-width: none; 
            justify-content: flex-start;
        }
        #brandMenu::-webkit-scrollbar { display: none; }
        
        .brand-item {
            font-family: 'Cinzel', serif; 
            border: 1px solid rgba(197, 160, 89, 0.5);
            padding: 6px 15px; 
            font-size: 10px; 
            text-transform: uppercase;
            color: var(--dourado-logo); 
            background: rgba(0, 0, 0, 0.2); 
            white-space: nowrap;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .brand-item.active { background: var(--dourado-logo); color: #000; }

        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            padding: 0 15px; 
        }

        @media (min-width: 1024px) {
            #brandMenu { justify-content: center; }
            .brand-item { font-size: 13px; padding: 10px 25px; }
            .product-grid { 
                grid-template-columns: repeat(4, 1fr); 
                max-width: 1400px;
                margin: 0 auto;
                gap: 30px;
            }
        }

        .product-card {
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(197, 160, 89, 0.08);
            padding: 20px 15px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            transition: transform 0.3s ease, border 0.3s ease;
        }
        .product-card:hover {
            border-color: rgba(197, 160, 89, 0.3);
        }

        .product-img { height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; cursor: pointer; }
        .product-img img { max-height: 100%; object-fit: contain; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); }
        .product-brand { font-size: 9px; color: var(--dourado-logo); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 2px; }
        .product-name { font-size: 13px; font-weight: 400; text-transform: uppercase; line-height: 1.3; height: 2.6em; overflow: hidden; margin-bottom: 10px; color: #fff; cursor: pointer; letter-spacing: 1px; }
        .product-price { font-size: 15px; font-weight: 300; color: #fff; margin-bottom: 18px; letter-spacing: 1px; }

        /* NOVO BOTÃO LUXO */
        .btn-add {
            background: transparent; 
            color: var(--dourado-logo); 
            width: 100%; 
            padding: 12px 5px; 
            border: 1px solid rgba(197, 160, 89, 0.4);
            font-weight: 400; 
            font-size: 10px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-add:active, .btn-add:hover {
            background: var(--dourado-logo);
            color: #000;
            border-color: var(--dourado-logo);
        }
        .btn-sold-out {
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
        }

        /* MODAIS */
        #productModal, #cartModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;

        .modal-container {
            background: var(--verde-fundo);

        @keyframes modalFadeUp {

            to { transform: translateY(0); opacity: 1; }

        .close-modal {
            position: absolute;

            color: var(--dourado-logo);

        }

        /* NOTIFICAÇÃO DE LUXO */
        #luxuryToast {
            visibility: hidden;
            min-width: 300px;
            background-color: var(--verde-detalhe);
            color: #fff;
            text-align: center;
            border-radius: 2px;
            border: 1px solid var(--dourado-logo);

            font-size: 12px;
            letter-spacing: 1px;
            font-family: 'Cinzel', serif;
        }
        #luxuryToast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 100px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 100px; opacity: 1; } to { bottom: 0; opacity: 0; } }

        .social-link svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0crXc21GaE7jllSoyZqiE5xIa7lGGvtKEFjbK-0oil1dQWdMwcz6cRpH70qPbWMwzZF1KlLEP8d83/pub?gid=0&single=true&output=csv'; 
        let database = [];
        let cart = [];
        const whatsappNumber = "5595991154395";

        function parseCSVLine(line) {
            const result = [];
            let cur = '';
            let inQuote = false;
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') inQuote = !inQuote;
                else if (char === ',' && !inQuote) { result.push(cur); cur = ''; }
                else cur += char;
            }
            result.push(cur);
            return result;
        }

        function showLuxuryToast() {
            const toast = document.getElementById("luxuryToast");
            toast.innerHTML = `<span style="color:var(--dourado-logo)">ADICIONADO</span><br>Produto inserido no seu carrinho`;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        async function loadSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1); 
                database = rows.map(row => {
                    const columns = parseCSVLine(row);
                    return {
                        id: columns[0]?.trim(),
                        marca: columns[1]?.trim(),
                        nome: columns[2]?.trim(),
                        preco: parseFloat(columns[3]?.replace(',', '.').trim() || 0),
                        imagem: columns[4]?.trim(),
                        descricao: columns[5]?.trim() || "Fragrância exclusiva da Assinatura Parfum."
                    };
                }).filter(p => p.nome && p.nome.length > 2 && p.preco >= 0);
                generateBrandMenu(database);
                displayProducts(database);
            } catch (e) { console.error(e); }
        }

        function generateBrandMenu(data) {
            const menu = document.getElementById('brandMenu');
            const brands = [...new Set(data.map(p => p.marca.trim()))].sort();
            let html = `<div class="brand-item active" onclick="filterByBrand('Todos', this)">TODOS</div>`;
            brands.forEach(b => html += `<div class="brand-item" onclick="filterByBrand('${b}', this)">${b.toUpperCase()}</div>`);
            menu.innerHTML = html;
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => {
                let controlsHtml = '';
                if (p.preco > 0) {
                    controlsHtml = `
                        <p class="product-price">R$ ${p.preco.toFixed(2).replace('.', ',')}</p>
                        <button class="btn-add" onclick="addToCart('${p.id}')">ADICIONAR AO CARRINHO</button>
                    `;
                } else {
                    controlsHtml = `
                        <p class="product-price" style="color: #666; text-decoration: line-through;">ESGOTADO</p>
                        <button class="btn-add btn-sold-out" disabled>PRODUTO INDISPONÍVEL</button>
                    `;
                }

                return `
                <div class="product-card">
                    <div onclick="openModal('${p.id}')">
                        <div class="product-img"><img src="${p.imagem}" onerror="this.src='assinatura.png'"></div>
                        <p class="product-brand">${p.marca}</p>
                        <h2 class="product-name font-luxury">${p.nome}</h2>
                    </div>
                    <div>
                        ${controlsHtml}
                    </div>
                </div>`;
            }).join('');
        }

        function openModal(id) {
            const p = database.find(item => item.id === id);
            const content = document.getElementById('modalContent');
            
            let modalButton = '';
            if (p.preco > 0) {
                modalButton = `<button class="btn-add !bg-white !text-black" onclick="closeModal('productModal'); addToCart('${p.id}')">ADICIONAR AO CARRINHO</button>`;
            } else {
                modalButton = `<button class="btn-add btn-sold-out" disabled>ESGOTADO</button>`;
            }

            content.innerHTML = `
                <div class="flex justify-center mb-6"><img src="${p.imagem}" class="h-56 object-contain" onerror="this.src='assinatura.png'"></div>
                <p class="product-brand text-center">${p.marca}</p>
                <h2 class="font-luxury text-2xl text-center text-white mb-3">${p.nome}</h2>
                <div class="w-12 h-[1px] bg-gold mx-auto mb-6" style="background:var(--dourado-logo)"></div>
                <p class="text-sm italic text-center text-gray-400 mb-6 px-4">"${p.descricao}"</p>
                <p class="text-center text-white font-semibold text-xl mb-6">${p.preco > 0 ? 'R$ ' + p.preco.toFixed(2).replace('.', ',') : 'ESGOTADO'}</p>
                ${modalButton}`;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeModalExterno(e, id) { if (e.target.id === id) closeModal(id); }

        function addToCart(id) {
            const p = database.find(i => i.id === id);
            const exist = cart.find(i => i.id === id);
            if (exist) exist.qty += 1;
            else cart.push({ ...p, qty: 1 });
            updateBadge();
            showLuxuryToast();
        }

        function changeQty(id, delta) {
            const cartIndex = cart.findIndex(i => i.id === id);
            if (cartIndex > -1) {
                cart[cartIndex].qty = Math.max(0, cart[cartIndex].qty + delta);
                if (cart[cartIndex].qty === 0) cart.splice(cartIndex, 1);
            }
            updateBadge();
            if (cart.length === 0) closeModal('cartModal');
            else renderCartSummary();
        }

        function updateBadge() {
            const total = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cartBadge').innerText = total;
        }

        function openCartModal() {
            if (cart.length === 0) { alert("Seu carrinho está vazio!"); return; }
            renderCartSummary();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function renderCartSummary() {
            const list = document.getElementById('cartSummaryList');
            let total = 0;
            list.innerHTML = cart.map(item => {
                const sub = item.preco * item.qty;
                total += sub;
                return `
                <div class="cart-item-row flex items-center gap-4">
                    <img src="${item.imagem}" class="w-12 h-12 object-contain bg-white bg-opacity-5 rounded" onerror="this.src='assinatura.png'">
                    <div class="flex-1">
                        <p class="text-white text-[11px] font-bold uppercase leading-tight">${item.nome}</p>
                        <div class="flex items-center gap-2 mt-2">
                            <button class="qty-btn !w-6 !h-6 !text-xs" onclick="changeQty('${item.id}', -1)">-</button>
                            <span class="text-white text-xs w-4 text-center">${item.qty}</span>
                            <button class="qty-btn !w-6 !h-6 !text-xs" onclick="changeQty('${item.id}', 1)">+</button>
                        </div>
                        <span class="remove-item mt-1 inline-block" onclick="removeFromCart('${item.id}')">Remover</span>
                    </div>
                    <div class="text-white text-sm font-semibold">R$ ${sub.toFixed(2).replace('.', ',')}</div>
                </div>`;
            }).join('');
            document.getElementById('cartSummaryTotal').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function removeFromCart(id) {
            const idx = cart.findIndex(i => i.id === id);
            if (idx > -1) {
                cart.splice(idx, 1);
                updateBadge();
                if (cart.length === 0) closeModal('cartModal');
                else renderCartSummary();
            }
        }

        function toggleDeliveryWarning(show) {
            document.getElementById('feeWarning').style.display = show ? 'block' : 'none';
        }

        function finalizeOrder() {
            const method = document.querySelector('input[name="deliveryMethod"]:checked').value;
            let message = "Olá! Gostaria de fazer um pedido:\n\n";
            let totalOrder = 0;
            cart.forEach(item => {
                let subtotal = item.preco * item.qty;
                message += `*${item.qty}x ${item.nome}*\n`;
                message += `Unid: R$ ${item.preco.toFixed(2)} | Sub: R$ ${subtotal.toFixed(2)}\n\n`;
                totalOrder += subtotal;
            });
            message += `*TOTAL DO PEDIDO: R$ ${totalOrder.toFixed(2)}*\n\n`;
            message += `*OPÇÃO:* ${method}`;
            if (method === "Entregar no Endereço") {
                message += "\n_(Taxa de entrega a consultar)_";
            }
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = database.filter(p => p.nome.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term));
            displayProducts(filtered);
        }

        function filterByBrand(brand, element) {
            document.querySelectorAll('.brand-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            const filtered = (brand === 'Todos') ? database : database.filter(p => p.marca.trim() === brand);
            displayProducts(filtered);
        }

        window.addEventListener('load', () => {
            loadSheetData();
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.transition = 'opacity 0.8s ease';
                splash.style.opacity = '0'; 
                setTimeout(() => splash.remove(), 800);
            }, 2500); 
        });
    </script>
</body>
</html>
