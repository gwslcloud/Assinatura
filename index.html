<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Perfume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-logo: #002218;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #000b08; 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        
        /* TELA DE BOAS-VINDAS (SPLASH SCREEN) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000b08;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .splash-logo-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* EFEITO SOFISTICADO: AURA E ANÉIS FINOS */
        .splash-logo-container::before {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(197,160,89,0.15) 0%, transparent 70%);
            animation: aura-breathe 3s infinite ease-in-out;
        }

        .ring {
            position: absolute;
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 50%;
            animation: ring-expand 3s infinite ease-out;
        }

        @keyframes aura-breathe {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
        }

        @keyframes ring-expand {
            0% { width: 100px; height: 100px; opacity: 0.8; }
            100% { width: 300px; height: 300px; opacity: 0; }
        }

        .pulse-logo {
            width: 260px;
            z-index: 10;
            position: relative;
        }

        .welcome-text {
            color: var(--dourado-logo);
            letter-spacing: 0.5em;
            font-size: 11px;
            margin-top: -45px; /* Colado na logo */
            font-weight: 400;
            z-index: 11;
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
            animation: fade-in 2s ease-in-out;
        }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

        /* HEADER E SITE */
        .logo-left {
            width: 140px; /* Logo mais harmônica no canto */
            margin-left: -10px;
        }

        .nav-link {
            transition: color 0.3s ease;
            font-size: 10px;
            letter-spacing: 0.2em;
        }

        /* BARRA DE BUSCA COM ESPAÇAMENTO PROPORCIONAL */
        .search-section {
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        .brand-menu-section {
            margin-bottom: 1.5rem;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--dourado-logo), var(--dourado-brilho));
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border-radius: 2px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(197, 160, 89, 0.1);
        }

        .img-container {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .img-container img { max-height: 85%; object-fit: contain; }

        @media (max-width: 767px) {
            .brand-menu { display: flex; overflow-x: auto; white-space: nowrap; gap: 10px; }
            .brand-menu::-webkit-scrollbar { display: none; }
        }

        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>
<body class="pb-10">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="ring"></div>
            <div class="ring" style="animation-delay: 1.5s;"></div>
            <img src="assinatura.png" alt="Logo" class="pulse-logo">
            <h1 class="font-luxury welcome-text text-center px-4">SEJA BEM VINDO</h1>
        </div>
    </div>

    <!-- HEADER (Logo Esquerda, Info mais pra cima) -->
    <header class="pt-6 px-6 flex flex-col items-start w-full">
        <img src="assinatura.png" alt="Assinatura Perfume" class="logo-left mb-2">
        
        <nav class="flex justify-start items-center space-x-5 text-gray-400 uppercase font-medium w-full border-b border-white/5 pb-4">
            <a href="#" class="nav-link hover:text-gold">Catálogo</a>
            <span class="text-gold/20">•</span>
            <a href="#" class="nav-link hover:text-gold">Masculinos</a>
            <span class="text-gold/20">•</span>
            <a href="#" class="nav-link hover:text-gold">Femininos</a>
        </nav>
    </header>

    <!-- BUSCA (Proporcional) -->
    <section class="search-section px-6">
        <div class="max-w-2xl border-b border-gold/30">
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Busque sua fragrância..." class="w-full bg-transparent py-3 text-sm font-light focus:outline-none tracking-widest text-white uppercase">
        </div>
    </section>

    <main class="container mx-auto px-6">
        <!-- MENU MARCAS (Otimizado Mobile) -->
        <div class="brand-menu-section">
            <ul class="brand-menu text-[10px] tracking-[0.1em] text-gray-400 uppercase font-medium">
                <li class="cursor-pointer hover:text-gold border border-gold/20 px-4 py-2 rounded-full" onclick="filterByBrand('Todos')">Todos</li>
                <li class="cursor-pointer hover:text-gold border border-gold/20 px-4 py-2 rounded-full" onclick="filterByBrand('Khadlaj')">Khadlaj</li>
                <li class="cursor-pointer hover:text-gold border border-gold/20 px-4 py-2 rounded-full" onclick="filterByBrand('Maison Alhambra')">Alhambra</li>
                <li class="cursor-pointer hover:text-gold border border-gold/20 px-4 py-2 rounded-full" onclick="filterByBrand('Lattafa')">Lattafa</li>
            </ul>
        </div>

        <!-- GRID PRODUTOS -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- WHATSAPP -->
    <a href="https://wa.me/5595991154395" class="whatsapp-float shadow-lg" target="_blank">
        <svg width="25" height="25" fill="white" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>
    </a>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.transition = 'opacity 0.6s ease';
                splash.style.opacity = '0'; 
                setTimeout(() => { splash.remove(); }, 600);
            }, 2500); 
        });

        const database = [
            { marca: "Khadlaj", nome: "Oud Al Sabah 100ml", preco: "100,00", imagem: "perfume1.webp", whatsapp: "5595991154395" },
            { marca: "Maison Alhambra", nome: "So Glam Rouge Intense 100ml", preco: "200,00", imagem: "perfume2.jpeg", whatsapp: "5595991154395" },
            { marca: "Lattafa", nome: "Asad 100ml", preco: "400,00", imagem: "perfume3.webp", whatsapp: "5595991154395" }
        ];

        const grid = document.getElementById('productGrid');

        function displayProducts(products) {
            grid.innerHTML = products.map(p => `
                <div class="product-card p-4 flex flex-col h-full">
                    <div class="img-container mb-3"><img src="${p.imagem}" alt="${p.nome}" loading="lazy" onerror="this.src='assinatura.png'"></div>
                    <div class="flex-grow text-center">
                        <p class="text-[8px] text-gold tracking-widest uppercase mb-1 opacity-60">${p.marca}</p>
                        <h2 class="font-luxury text-xs mb-2 h-8 overflow-hidden leading-tight uppercase">${p.nome}</h2>
                        <p class="text-lg font-light mb-4 text-white/90">R$ ${p.preco}</p>
                    </div>
                    <a href="https://wa.me/${p.whatsapp}?text=Olá! Gostaria de encomendar o perfume ${p.nome}" target="_blank" 
                       class="btn-gold py-3 text-center text-[10px] active:scale-95 transition-transform">
                        COMPRAR AGORA
                    </a>
                </div>
            `).join('');
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            displayProducts(database.filter(p => p.nome.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term)));
        }

        function filterByBrand(brand) {
            brand === 'Todos' ? displayProducts(database) : displayProducts(database.filter(p => p.marca.toLowerCase().includes(brand.toLowerCase())));
        }

        displayProducts(database);
    </script>
</body>
</html>
