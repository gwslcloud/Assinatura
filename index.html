<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Perfume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-logo: #002218;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #000b08; 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        
        /* TELA DE BOAS-VINDAS (SPLASH SCREEN) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000b08;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .splash-logo-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* PULSO DOURADO CIRCULAR */
        .splash-logo-container::before {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid var(--dourado-logo);
            border-radius: 50%;
            animation: ripple-gold 2s infinite;
            opacity: 0;
        }

        @keyframes ripple-gold {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .pulse-logo {
            width: 250px; /* Logo aumentada */
            z-index: 10;
            animation: logo-scale 2s infinite ease-in-out;
        }

        @keyframes logo-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .welcome-text {
            color: var(--dourado-logo);
            letter-spacing: 0.4em;
            font-size: 13px;
            margin-top: -30px; /* Puxa o texto para bem perto da logo */
            z-index: 11;
            opacity: 0;
            animation: text-fade 2s forwards;
        }

        @keyframes text-fade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ESTILO DO SITE - AJUSTES DE ESPAÇAMENTO */
        .header-compact {
            padding-top: 1rem;
            padding-bottom: 0;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--dourado-logo), var(--dourado-brilho));
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(197, 160, 89, 0.15);
        }

        .img-container {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-container img { max-height: 85%; max-width: 85%; object-fit: contain; }

        @media (max-width: 767px) {
            .brand-menu { display: flex; overflow-x: auto; white-space: nowrap; gap: 10px; padding-bottom: 5px; }
        }

        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>
<body class="pb-10">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <img src="assinatura.png" alt="Logo" class="pulse-logo">
        </div>
        <h1 class="font-luxury welcome-text text-center px-4">SEJA BEM VINDO</h1>
    </div>

    <!-- WHATSAPP -->
    <a href="https://wa.me/5595991154395" class="whatsapp-float" target="_blank">
        <svg width="25" height="25" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>
    </a>

    <!-- HEADER (Espaços reduzidos e logo alinhada) -->
    <header class="header-compact flex flex-col items-center px-6 text-center">
        <img src="assinatura.png" alt="Assinatura Perfume" class="w-48 md:w-64 mb-1 drop-shadow-[0_0_15px_rgba(197,160,89,0.2)]">
        
        <nav class="flex justify-center items-center space-x-6 text-[10px] md:text-sm tracking-[0.2em] uppercase text-gray-400 font-medium mb-2">
            <a href="#" class="hover:text-gold transition">Catálogo</a><span class="text-gold/20">•</span>
            <a href="#" class="hover:text-gold transition">Masculinos</a><span class="text-gold/20">•</span>
            <a href="#" class="hover:text-gold transition">Femininos</a>
        </nav>
    </header>

    <!-- BUSCA (Subiu mais na tela) -->
    <div class="container mx-auto px-6 mb-4">
        <div class="max-w-xl mx-auto border-b border-gold/20">
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="BUSQUE UMA FRAGRÂNCIA..." class="w-full bg-transparent py-2 text-center text-sm md:text-lg font-light focus:outline-none placeholder:text-gray-800 tracking-widest text-white uppercase">
        </div>
    </div>

    <main class="container mx-auto px-6 flex flex-col md:flex-row gap-4">
        <!-- Sidebar Marcas Compacta -->
        <aside class="w-full md:w-1/4">
            <ul class="brand-menu text-[9px] md:text-xs tracking-[0.2em] text-gray-400 uppercase font-medium md:space-y-3">
                <li class="cursor-pointer hover:text-gold border border-gold/10 md:border-0 px-3 py-1.5 md:p-0 rounded-full" onclick="filterByBrand('Todos')">Todos</li>
                <li class="cursor-pointer hover:text-gold border border-gold/10 md:border-0 px-3 py-1.5 md:p-0 rounded-full" onclick="filterByBrand('Khadlaj')">Khadlaj</li>
                <li class="cursor-pointer hover:text-gold border border-gold/10 md:border-0 px-3 py-1.5 md:p-0 rounded-full" onclick="filterByBrand('Maison Alhambra')">Alhambra</li>
                <li class="cursor-pointer hover:text-gold border border-gold/10 md:border-0 px-3 py-1.5 md:p-0 rounded-full" onclick="filterByBrand('Lattafa')">Lattafa</li>
            </ul>
        </aside>

        <!-- Grid de Produtos -->
        <section class="w-full md:w-3/4">
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>
    </main>

    <footer class="mt-10 py-6 border-t border-white/5 text-center px-6 flex flex-col items-center">
        <p class="text-[8px] tracking-[0.4em] text-gray-600 uppercase mb-2">Assinatura Perfume © 2026</p>
        <a href="https://www.instagram.com/leandroreiiis" target="_blank" class="insta-link flex items-center gap-2 opacity-70">
            <span class="text-[9px] tracking-[0.2em] uppercase">instagram</span>
        </a>
    </footer>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0'; 
                setTimeout(() => { splash.remove(); }, 400);
            }, 2000); 
        });

        const database = [
            { marca: "Khadlaj", nome: "Oud Al Sabah 100ml", preco: "100,00", imagem: "perfume1.webp", whatsapp: "5595991154395" },
            { marca: "Maison Alhambra", nome: "So Glam Rouge Intense 100ml", preco: "200,00", imagem: "perfume2.jpeg", whatsapp: "5595991154395" },
            { marca: "Lattafa", nome: "Asad 100ml", preco: "400,00", imagem: "perfume3.webp", whatsapp: "5595991154395" }
        ];

        const grid = document.getElementById('productGrid');

        function displayProducts(products) {
            grid.innerHTML = products.map(p => `
                <div class="product-card p-4 flex flex-col h-full text-center">
                    <div class="img-container mb-2"><img src="${p.imagem}" alt="${p.nome}" loading="lazy" onerror="this.src='assinatura.png'"></div>
                    <div class="flex-grow">
                        <p class="text-[8px] text-gold tracking-widest uppercase mb-1 opacity-60">${p.marca}</p>
                        <h2 class="font-luxury text-sm mb-2 h-10 overflow-hidden leading-tight uppercase">${p.nome}</h2>
                        <p class="text-lg font-light mb-3 text-white/90">R$ ${p.preco}</p>
                    </div>
                    <a href="https://wa.me/${p.whatsapp}?text=Olá! Gostaria de encomendar o perfume ${p.nome}" target="_blank" 
                       class="btn-gold py-3 text-center text-[10px] active:scale-95 transition-transform">
                        COMPRAR NO WHATSAPP
                    </a>
                </div>
            `).join('');
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            displayProducts(database.filter(p => p.nome.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term)));
        }

        function filterByBrand(brand) {
            brand === 'Todos' ? displayProducts(database) : displayProducts(database.filter(p => p.marca.toLowerCase().includes(brand.toLowerCase())));
            if(window.innerWidth < 768) window.scrollTo({ top: 200, behavior: 'smooth' });
        }

        displayProducts(database);
    </script>
</body>
</html>
