<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura Perfume | Luxury Boutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-logo: #002218;
            --dourado-logo: #c5a059;
            --dourado-brilho: #e2c275;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #000b08; 
            color: #fff;
            overflow-x: hidden;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        
        .btn-gold {
            background: linear-gradient(135deg, var(--dourado-logo), var(--dourado-brilho));
            color: #000;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .btn-gold:hover {
            box-shadow: 0 0 25px rgba(197, 160, 89, 0.5);
            transform: translateY(-2px);
        }

        .product-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(197, 160, 89, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .product-card:hover {
            border: 1px solid var(--dourado-logo);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Ajuste para as fotos dos perfumes não cortarem */
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Garante que o frasco apareça inteiro */
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- Header / Logo -->
    <header class="py-12 flex flex-col items-center">
        <img src="assinatura.jpeg" alt="Assinatura Perfume" class="w-64 md:w-80 mb-8 drop-shadow-[0_0_15px_rgba(197,160,89,0.3)]">
        
        <nav class="flex space-x-8 text-[10px] md:text-xs tracking-[0.3em] uppercase opacity-60 font-light">
            <a href="#" class="hover:text-gold transition">Catálogo</a>
            <a href="#" class="hover:text-gold transition">Masculinos</a>
            <a href="#" class="hover:text-gold transition">Femininos</a>
        </nav>
    </header>

    <!-- Barra de Busca (Sem Emoji) -->
    <div class="container mx-auto px-4 mb-16 text-center">
        <div class="max-w-xl mx-auto border-b border-gold/30 group">
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="BUSQUE UMA FRAGRÂNCIA..." 
                class="w-full bg-transparent py-4 text-center text-lg font-light focus:outline-none focus:border-gold transition-all placeholder:text-gray-700 tracking-[0.2em]">
        </div>
    </div>

    <main class="container mx-auto px-4 flex flex-col md:flex-row gap-12 pb-20">
        
        <!-- Lateral: Marcas -->
        <aside class="w-full md:w-1/5">
            <h3 class="font-luxury text-gold text-lg mb-8 tracking-widest border-b border-gold/10 pb-2 uppercase">Marcas</h3>
            <ul class="space-y-4 text-[11px] tracking-widest text-gray-500 uppercase">
                <li class="hover:text-gold cursor-pointer transition flex items-center gap-2" onclick="filterByBrand('Todos')">
                    <span class="w-1 h-1 rounded-full bg-gold/50"></span> Todos
                </li>
                <li class="hover:text-gold cursor-pointer transition flex items-center gap-2" onclick="filterByBrand('Khadlaj')">
                    <span class="w-1 h-1 rounded-full bg-gold/50"></span> Khadlaj
                </li>
                <li class="hover:text-gold cursor-pointer transition flex items-center gap-2" onclick="filterByBrand('Maison Alhambra')">
                    <span class="w-1 h-1 rounded-full bg-gold/50"></span> Maison Alhambra
                </li>
                <li class="hover:text-gold cursor-pointer transition flex items-center gap-2" onclick="filterByBrand('Lattafa')">
                    <span class="w-1 h-1 rounded-full bg-gold/50"></span> Lattafa
                </li>
            </ul>
        </aside>

        <!-- Grade de Produtos -->
        <section class="w-full md:w-4/5">
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Conteúdo via JS -->
            </div>
        </section>
    </main>

    <script>
        const database = [
            {
                marca: "Khadlaj",
                nome: "Oud Al Sabah 100ml",
                preco: "100,00",
                imagem: "perfume1.jpeg",
                whatsapp: "55XXXXXXXXXXX"
            },
            {
                marca: "Maison Alhambra",
                nome: "So Glam Rouge Intense 100ml",
                preco: "200,00",
                imagem: "perfume2.jpeg",
                whatsapp: "55XXXXXXXXXXX"
            },
            {
                marca: "Lattafa",
                nome: "Asad 100ml",
                preco: "400,00",
                imagem: "perfume3.webp", // Ajustado para .webp
                whatsapp: "55XXXXXXXXXXX"
            }
        ];

        const grid = document.getElementById('productGrid');

        function displayProducts(products) {
            grid.innerHTML = products.map(p => `
                <div class="product-card p-4 flex flex-col group h-full">
                    <div class="img-container relative overflow-hidden aspect-[3/4] mb-6 bg-black/40 rounded-sm">
                        <img src="${p.imagem}" alt="${p.nome}" class="transition duration-700 group-hover:scale-105">
                    </div>
                    
                    <div class="flex-grow text-center">
                        <p class="text-[9px] text-gold tracking-widest uppercase mb-1 opacity-50">${p.marca}</p>
                        <h2 class="font-luxury text-sm mb-4 h-10 overflow-hidden tracking-wide">${p.nome}</h2>
                        <p class="text-xl font-light mb-6 tracking-tighter">R$ ${p.preco}</p>
                    </div>

                    <a href="https://wa.me/${p.whatsapp}?text=Olá! Gostaria de informações sobre o ${p.nome}" target="_blank" 
                       class="btn-gold py-3 text-center text-[10px] tracking-widest">
                        Solicitar via WhatsApp
                    </a>
                </div>
            `).join('');
        }

        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = database.filter(p => p.nome.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term));
            displayProducts(filtered);
        }

        function filterByBrand(brand) {
            if(brand === 'Todos') {
                displayProducts(database);
            } else {
                const filtered = database.filter(p => p.marca === brand);
                displayProducts(filtered);
            }
        }

        displayProducts(database);
    </script>
</body>
</html>
